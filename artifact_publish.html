  const wantsToPass = !!leader && gapToLeader < safeMi * PASS_CONSIDER_MULT + timeGap;
  const inArrivalZone = arrivalSpeedCap(graph, truck, cruiseTargetSpeed) < cruiseTargetSpeed;
  if (truck.lane === 0 && wantsToPass && !inArrivalZone && truck.driver.aggression > PASS_AGGRESSION_THRESHOLD) {
    const leftArr = group.lane1;
    const clear = !leftArr.some((t) => t.s > truck.s - safeMi * PASS_CLEAR_BEHIND_MULT && t.s < leader.s + safeMi * PASS_CLEAR_AHEAD_MULT);
    if (clear) {
      truck.lane = 1;
      truck.passingLeaderId = leader.id;
    }
  } else if (truck.lane === 1 && truck.passingLeaderId != null) {
    // Merge back once clear of the truck being passed (or it's gone -
    // arrived, took a different edge, whatever) and lane 0 is clear alongside.
    const passed = group.lane0.find((t) => t.id === truck.passingLeaderId);
    const clearOfPassed = !passed || (truck.s - passed.s) > safeMi * MERGE_BACK_CLEAR_MULT;
    if (clearOfPassed) {
      const lane0Clear = !group.lane0.some((t) => t.s > truck.s - safeMi * PASS_CLEAR_BEHIND_MULT && t.s < truck.s + safeMi * PASS_CLEAR_AHEAD_MULT);
      if (lane0Clear) { truck.lane = 0; truck.passingLeaderId = null; }
    }
  }

  return followCap;
}

// A truck stopped at a real city, waiting for room to pull into the
// destination edge's right lane. Departs once clear, or once the
// defensive timeout elapses - either way it enters at s=0/speed=0, so
// the normal accel easing on the next tick is what gives it the
// "accelerate away from the city" look, with no extra mechanism needed.
//
// A waiting truck has no `edge` yet, so buildLaneGroups' pre-tick
// snapshot never included it - meaning two trucks queued to depart onto
// the SAME edge from the same city wouldn't see each other and could
// both land at s=0 in the same tick. `placeOnEdge` registering a truck
// into the lane group the instant it enters (not just at the top of the
// next tick) closes that: any other truck processed later this same
// tick sees it and correctly waits/nudges instead.
function tryDepartTruck(graph, truck, laneGroups, dt) {
  const key = edgeId(truck.pendingEdge);
  const lane0 = laneGroups.get(key)?.lane0 || [];
  const safeMi = minSafeMiles(graph, truck.pendingEdge);
  const blocked = truck.pendingEdge.kind === "interstate" && lane0.some((t) => t.s < safeMi);

  truck.departureWaitS += dt;
  if (!blocked || truck.departureWaitS > MAX_DEPARTURE_WAIT_REAL_S) {
    placeOnEdge(graph, truck, truck.pendingEdge, laneGroups);
  }
}

// Places a truck onto `edge` at s=0 and registers it into this tick's
// lane groups so any other truck placed onto the same edge later in the
// same tick sees it. `truck.lane`/`laneT` are left exactly as the caller
// set them: a fresh departure from a full stop already has them reset to
// 0 by the time this runs (see tryDepartTruck), while a truck merely
// continuing through a junction or a mid-route city keeps whatever lane
// it was already in - it stays in the passing lane straight through the
// node rather than snapping back to the right lane, matching a truck
// it's mid-pass on doing the same. If something's already sitting nearby
// (two or more trucks converging through the same junction onto the same
// next edge in the same tick, the one unprotected case a stop-and-wait
// deliberately doesn't cover - junctions aren't real stops), nudge in
// just behind it instead of landing exactly on top of it - checking BOTH
// lanes (a truck can enter right next to a lane-1 occupant that's still
// mid-lane-change, not yet far enough over to be laterally clear on its
// own) and chaining past a whole run of them: checking only the single
// nearest occupant isn't enough once a third truck can arrive the same
// tick and need to clear the truck the *second* one was just nudged
// behind, not the original.
function placeOnEdge(graph, truck, edge, laneGroups) {
  truck.edge = edge;
  truck.pendingEdge = null;
  const key = edgeId(edge);
  let group = laneGroups ? laneGroups.get(key) : null;
  const unitsPerMile = worldUnitsPerMile(graph, edge);
  const myOffset = laneOffset(truck);
  let s = 0;
  if (group) {
    const occupants = [...group.lane0, ...group.lane1].sort((a, b) => a.s - b.s);
    for (const t of occupants) {
      const target = crossLaneTarget(t.laneT, truck.laneT);
      const perpGap = Math.abs(laneOffset(t) - myOffset);
      if (perpGap >= target) continue; // laterally clear regardless of s
      const neededWorldGap = Math.sqrt(target ** 2 - perpGap ** 2);
      const neededMiles = Math.min(neededWorldGap / unitsPerMile, edge.miles);
      if (Math.abs(t.s - s) < neededMiles) s = t.s + neededMiles;
    }
    if (s > edge.miles && group) {
      // Chaining forward past a long run of occupants ran out of edge
      // before it ran out of trucks to clear. Simply clamping every such
      // truck to the same edge.miles boundary would just recreate an
      // exact tie one step removed (each one's chain sees the previous
      // truck sitting at that same collapsed point and overflows past it
      // again) - pack backward from the end instead, so a crowded edge
      // degrades to "tighter than ideal" rather than "literally on top
      // of each other".
      s = edge.miles;
      const byDistance = [...group.lane0, ...group.lane1].sort((a, b) => b.s - a.s);
      for (const t of byDistance) {
        if (t.s < s) break; // already comfortably behind this candidate slot
        const target = crossLaneTarget(t.laneT, truck.laneT);
        const perpGap = Math.abs(laneOffset(t) - myOffset);
        if (perpGap >= target) continue;
        const neededWorldGap = Math.sqrt(target ** 2 - perpGap ** 2);
        const neededMiles = Math.min(neededWorldGap / unitsPerMile, edge.miles);
        if (t.s - s < neededMiles) s = Math.max(0, t.s - neededMiles);
      }
    }
  }
  // Clamp the final result to this edge's own length no matter which
  // pass produced it, so a truck can never be placed beyond where it's
  // already due to arrive. (If that leaves it packed in tighter than
  // ideal, that's the same "edge too short to fully
  // separate everyone on it" tradeoff documented on minSafeMiles.)
  truck.s = Math.min(s, edge.miles);
  if (laneGroups) {
    if (!group) { group = { lane0: [], lane1: [] }; laneGroups.set(key, group); }
    const arr = truck.lane === 1 ? group.lane1 : group.lane0;
    arr.push(truck);
    arr.sort((a, b) => a.s - b.s); // keep the ascending-by-progress invariant intact for this tick's remaining lookups
  }
}

// Mirrors render.js's truckWorldPos lane-blend exactly: a truck mid-way
// through a lane change (0 < laneT < 1) sits only partway toward the
// passing lane's full separation from lane 0.
function laneOffset(truck) {
  return RIGHT_LANE_OFFSET + (LEFT_LANE_OFFSET - RIGHT_LANE_OFFSET) * truck.laneT;
}

// The along-edge gap threshold two trucks need, continuously interpolated
// on how far apart their laneT actually is - NOT on the discrete `.lane`
// target flag. RIGHT_LANE_OFFSET - LEFT_LANE_OFFSET === CROSS_LANE_TARGET_
// WORLD_UNITS by construction, so perpGap between any two trucks is always
// exactly CROSS_LANE_TARGET_WORLD_UNITS * |Δlanet|, bounded in [0,
// CROSS_LANE_TARGET_WORLD_UNITS] - meaning a plain linear ramp from
// MIN_DOT_GAP_WORLD_UNITS (same visual lane) down to CROSS_LANE_TARGET_
// WORLD_UNITS (fully opposite lanes) lands exactly on both today's steady-
// state endpoints with a smooth, monotonic gradient between them. Using
// the discrete flag instead (as this used to) relaxes the threshold the
// instant a pass/merge DECISION is made, before the truck has actually
// moved sideways - reading as a same-tick longitudinal snap rather than a
// diagonal glide. This formula makes that discontinuity structurally
// impossible rather than just less likely.
function crossLaneTarget(laneTA, laneTB) {
  const diff = Math.abs(laneTA - laneTB);
  return MIN_DOT_GAP_WORLD_UNITS - (MIN_DOT_GAP_WORLD_UNITS - CROSS_LANE_TARGET_WORLD_UNITS) * diff;
}

// After every truck has moved this tick, two trucks can still end up too
// close: car-following/passing above only reacts to *last* tick's other
// trucks, so a leader braking hard (its own arrival-decel, using a
// decelRate up to 5.2) can lose speed faster within a single tick than a
// one-tick-lagged follower can track - and a truck early in a lane
// change (laneT still near 0) hasn't yet gained the passing lane's full
// lateral separation, so a fresh departure landing nearby in the other
// lane can still end up closer than it looks from `s` alone. Rather
// than chase either case with ever-tighter speed/timing heuristics,
// this clamps positions directly after integration using each truck's
// TRUE rendered offset (same formula as truckWorldPos) and the real
// Pythagorean distance - front-to-back per edge, each truck capped to
// whatever along-edge gap is still needed once its actual lateral
// separation from the truck ahead is accounted for. This guarantees the
// render-time gap regardless of how the speed/lane decisions played
// out. A truck clamped back below its edge's length simply arrives a
// tick later than it otherwise would (a realistic "stuck behind stopped
// traffic" outcome).
// Takes the tick's already-built `laneGroups` (same Map updateFleet's
// Phase 1 uses) instead of re-deriving its own grouping from `trucks` -
// still avoids the full O(n) Map-rebuild-from-`trucks` every tick (group
// MEMBERSHIP by edge doesn't change mid-tick), but each group's `lane0`/
// `lane1` were only sorted once, at the top of updateFleet, BEFORE Phase 1
// (speed decisions) and Phase 2 (position integration) ran - different
// trucks move different distances this same tick, which can and does
// reorder their relative `.s` within a lane before clampOverlaps runs
// (confirmed empirically: two same-lane trucks swapped relative order
// within a single tick during verification). So this still needs a fresh
// sort by CURRENT `.s`, not a merge that trusts the stale buildLaneGroups
// order - a merge would silently process pairs in the wrong order.
function clampOverlaps(graph, laneGroups) {
  for (const group of laneGroups.values()) {
    if (group.edge.kind !== "interstate") continue;
    if (group.lane0.length + group.lane1.length < 2) continue;
    const ascending = [...group.lane0, ...group.lane1].sort((a, b) => a.s - b.s);
    const unitsPerMile = worldUnitsPerMile(graph, group.edge);
    // Walk front-to-back (highest `.s` first) by iterating the ascending
    // merge in reverse - equivalent to the original's fresh descending
    // sort, without building a second array.
    for (let i = ascending.length - 1; i > 0; i--) {
      const ahead = ascending[i], behind = ascending[i - 1];
      const target = crossLaneTarget(ahead.laneT, behind.laneT);
      const perpGap = Math.abs(laneOffset(ahead) - laneOffset(behind));
      if (perpGap >= target) continue; // laterally clear regardless of along-edge gap
      const neededWorldGap = Math.sqrt(target ** 2 - perpGap ** 2);
      const neededMiles = Math.min(neededWorldGap / unitsPerMile, ahead.edge.miles);
      const maxAllowed = ahead.s - neededMiles;
      // Each pairwise push is capped to the edge's own length, but (as in
      // placeOnEdge) that only bounds one step, not a chain of several -
      // clamp the final result too so a reduction can never itself leave
      // a truck's s negative-then-wrapped or otherwise inconsistent.
      if (behind.s > maxAllowed) behind.s = Math.max(0, Math.min(maxAllowed, ahead.edge.miles));
    }
  }
}

// Advances every truck by `dt` real seconds at the given time-scale
// multiplier. Returns the truck awaiting a junction decision, if any
// (only possible for `controlledTruck` - the one truck the player has
// explicitly taken control of via the details panel, a separate,
// narrower thing than merely being followed by the camera), so the
// caller can pause the whole sim and show the decision panel.
function updateFleet(graph, trucks, dt, timeScale, controlledTruck, env = null) {
  const gameHours = (dt * BASE_TIME_SCALE * timeScale) / 3600;
  const laneGroups = buildLaneGroups(trucks);

  // Precomputed once per tick, before Phase 1 mutates anything: each
  // truck's leader (the next entry in its lane array, or null), from the
  // same fresh laneGroups snapshot Phase 1 already relies on. O(1) lookup
  // per truck in Phase 1 below instead of the old `ownArr.indexOf(truck)`
  // rescan - built here (rather than inline per-truck) specifically so
  // Phase 1's own iteration order over `trucks` doesn't change (see the
  // long comment on applyFollowAndPassing for why that order matters).
  const leaderMap = new Map();
  for (const group of laneGroups.values()) {
    for (const lane of [group.lane0, group.lane1]) {
      for (let i = 0; i < lane.length - 1; i++) leaderMap.set(lane[i], lane[i + 1]);
    }
  }

  // Phase 1: decide each truck's target speed/lane and ease toward it -
  // reads other trucks' pre-move positions (laneGroups/leaderMap), same
  // as before.
  for (const truck of trucks) {
    if (truck.awaitingDecision || truck.awaitingContract || truck.pendingEdge || !truck.edge) continue;

    let targetSpeed = truck.edge.speedLimit * truck.driver.cruiseMult;
    // Environmental slowdowns are applied to the CRUISE target rather than
    // as a hard cap, so car-following and the arrival decel below still
    // compose on top normally - a truck crawling through a blizzard still
    // brakes for the truck in front of it.
    if (env) targetSpeed *= environmentSpeedMult(graph, truck, env);
    targetSpeed = Math.min(targetSpeed, arrivalSpeedCap(graph, truck, targetSpeed));
    targetSpeed = Math.min(targetSpeed, applyFollowAndPassing(graph, truck, laneGroups, leaderMap, targetSpeed));

    const rate = targetSpeed >= truck.speed ? truck.driver.accelRate : truck.driver.decelRate;
    truck.speed += (targetSpeed - truck.speed) * Math.min(1, dt * rate);
    truck.laneT += (truck.lane - truck.laneT) * Math.min(1, dt * LANE_CHANGE_EASE);
  }

  // Phase 2: integrate position from the speed each truck just settled on.
  for (const truck of trucks) {
    if (truck.awaitingDecision || truck.awaitingContract || truck.pendingEdge || !truck.edge) continue;
    const miles = truck.speed * gameHours;
    truck.s += miles;
    truck.totalMilesDriven += miles;
  }

  // Phase 3: hard anti-overlap clamp on the post-move positions (see
  // clampOverlaps above for why this can't just be folded into phase 1).
  clampOverlaps(graph, laneGroups);

  // Phase 3b: border-crossing customs timers/releases. Deliberately its
  // own pass over crossings (not folded into Phase 4's per-truck loop) -
  // a crossing's timer belongs to the CROSSING, not to any one truck, and
  // releasing a truck here (onto an edge via placeOnEdge, or teleported
  // across for an urban crossing) is exactly equivalent to a truck
  // starting a fresh edge elsewhere in Phase 4, just running one pass
  // earlier so this frame's Phase 1/2 already skipped it via `!truck.edge`
  // same as any other stationary truck.
  tickCustomsCrossings(graph, laneGroups, gameHours, Math.random);

  // Phase 4: layovers, arrivals, junction decisions, and departures, using
  // the final (clamped) positions.
  for (const truck of trucks) {
    if (truck.awaitingDecision || truck.awaitingContract) continue;

    // Parked between loads. Burn down the layover, then take a contract -
    // the player picks for the controlled truck, the driver's own
    // preferences pick for everyone else.
    if (truck.parkedAt) {
      truck.dwellHoursLeft -= gameHours;
      if (truck.dwellHoursLeft > 0) continue;
      const offers = generateContractOffers(graph, truck.parkedAt, OFFER_COUNT, Math.random, truck.driver);
      if (!offers.length) {
        // Nothing routable from here (shouldn't happen on this graph, but
        // don't wedge the truck forever if it ever does) - wait and retry.
        truck.dwellHoursLeft = 1;
        continue;
      }
      if (truck === controlledTruck) {
        truck.pendingOffers = offers;
        truck.awaitingContract = true;
        return truck;
      }
      truck._takeContract(graph, chooseOffer(offers, truck.driver), laneGroups);
      continue;
    }

    if (truck.pendingEdge) {
      tryDepartTruck(graph, truck, laneGroups, dt);
      continue;
    }
    if (!truck.edge) continue; // truly stranded
    if (truck.s < truck.edge.miles) continue;

    const node = truck.edge.to;
    truck.currentNode = node;
    if (node === truck.contract.destination) {
      truck._arriveAtDestination(graph);
      continue;
    }

    if (truck === controlledTruck) {
      const options = pickEdgesFrom(graph, node, truck.edge);
      if (options.length > 1) {
        truck.pendingOptions = rankAndCapOptions(graph, options, truck.remainingPath[0]);
        truck.awaitingDecision = true;
        return truck;
      }
    }
    truck._advanceToNextEdge(graph, laneGroups);
  }
  return null;
}


// ==== camera.js ====
// camera.js - flat top-down pan/zoom camera with a FREE (user-driven) mode,
// a FOLLOW mode that smoothly centers on a target (a truck), and a
// FOLLOW_NAV mode - a tilted, heading-aligned "chase cam" that rotates so
// the followed truck's current direction of travel always points toward
// the top of the screen, turn-by-turn-nav-app style.
"use strict";

const TAP_MOVE_THRESHOLD = 8; // px
const TAP_MAX_DURATION = 300; // ms
const FOLLOW_LERP = 0.08;
const FOLLOW_ZOOM = 2.4;
const HEADING_LERP = 0.08; // matches FOLLOW_LERP - no reason to diverge initially
const TILT_FACTOR = 0.45; // Y-axis compression in FOLLOW_NAV, faking a tilted viewing angle - exported: render.js's drawFrame needs the exact value

// Plain linear easing breaks at the 0/2*PI wrap (e.g. easing from 350deg
// to 10deg must go forward through 360deg, not backward through 180deg) -
// this always returns the shorter signed delta regardless of how far
// `from` has drifted outside [0, 2*PI) (it never needs renormalizing;
// sin/cos are happy with an unbounded angle and this is recomputed fresh
// every tick anyway).
function shortestAngleDelta(from, to) {
  let d = (to - from) % (2 * Math.PI);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

class Camera {
  constructor(canvas, { x = 0, y = 0, zoom = 0.3, minZoom = 0.05, maxZoom = 6, onTap = null } = {}) {
    this.canvas = canvas;
    this.x = x;
    this.y = y;
    this.zoom = zoom;
    this.baseZoom = zoom; // the initial fit-to-screen zoom; render.js keys city-label tiers off this
    this.minZoom = minZoom;
    this.maxZoom = maxZoom;
    this.mode = "FREE"; // "FREE" | "FOLLOW" | "FOLLOW_NAV"
    this.followTarget = null;
    this.onTap = onTap;
    this.visualCenterYRatio = 0.42; // bias the focal point up so the bottom sheet doesn't cover it
    // FOLLOW_NAV pushes the pivot further down than flat FOLLOW's 0.42 -
    // the truck sits lower on screen, leaving more room above it for the
    // road ahead (which always renders toward the top once rotated).
    // Capped well under ~0.55: the bottom sheet covers roughly the
    // bottom 45% of the viewport (see main.js's fitZoom, which reserves
    // the same 55% for the map), so a ratio much past that hides the
    // truck's own dot underneath the sheet - confirmed by an actual
    // rendered screenshot during implementation, not just arithmetic.
    this.visualCenterYRatioNav = 0.48;

    // FOLLOW_NAV-only state: `heading` is the currently-rendered camera
    // rotation (radians, same compass convention as edge.bearing - 0deg
    // north, clockwise), eased each update() toward `targetHeading` (set
    // by main.js from the followed truck's current edge bearing).
    // Meaningless/unused outside FOLLOW_NAV.
    this.heading = 0;
    this.targetHeading = 0;

    this._bindInput();
  }

  visualCenter() {
    const ratio = this.mode === "FOLLOW_NAV" ? this.visualCenterYRatioNav : this.visualCenterYRatio;
    return { x: this.canvas.clientWidth / 2, y: this.canvas.clientHeight * ratio };
  }

  screenToWorld(sx, sy) {
    const c = this.visualCenter();
    return { x: (sx - c.x) / this.zoom + this.x, y: (sy - c.y) / this.zoom + this.y };
  }

  worldToScreen(wx, wy) {
    const c = this.visualCenter();
    return { x: c.x + (wx - this.x) * this.zoom, y: c.y + (wy - this.y) * this.zoom };
  }

  follow(target) {
    this.mode = "FOLLOW";
    this.followTarget = target;
  }

  unfollow() {
    this.mode = "FREE";
    this.followTarget = null;
  }

  clampZoom(z) {
    return Math.max(this.minZoom, Math.min(this.maxZoom, z));
  }

  update() {
    if ((this.mode === "FOLLOW" || this.mode === "FOLLOW_NAV") && this.followTarget) {
      this.x += (this.followTarget.x - this.x) * FOLLOW_LERP;
      this.y += (this.followTarget.y - this.y) * FOLLOW_LERP;
      this.zoom += (FOLLOW_ZOOM - this.zoom) * FOLLOW_LERP;
    }
    if (this.mode === "FOLLOW_NAV") {
      this.heading += shortestAngleDelta(this.heading, this.targetHeading) * HEADING_LERP;
    }
  }

  _bindInput() {
    const canvas = this.canvas;
    let dragging = false, moved = false, tapStart = 0;
    let lastX = 0, lastY = 0;
    let pinchDist = 0;

    const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const center = (touches) => {
      let x = 0, y = 0;
      for (const t of touches) { x += t.clientX; y += t.clientY; }
      return { x: x / touches.length, y: y / touches.length };
    };

    const startDrag = (sx, sy) => {
      dragging = true; moved = false; tapStart = Date.now();
      lastX = sx; lastY = sy;
      if (this.mode === "FOLLOW" || this.mode === "FOLLOW_NAV") this.unfollow();
    };
    const doDrag = (sx, sy) => {
      const dx = sx - lastX, dy = sy - lastY;
      if (Math.abs(dx) > TAP_MOVE_THRESHOLD || Math.abs(dy) > TAP_MOVE_THRESHOLD) moved = true;
      this.x -= dx / this.zoom;
      this.y -= dy / this.zoom;
      lastX = sx; lastY = sy;
    };
    const endDrag = (sx, sy) => {
      dragging = false;
      if (!moved && !gestureMultiTouch && Date.now() - tapStart < TAP_MAX_DURATION && this.onTap) {
        const w = this.screenToWorld(sx, sy);
        this.onTap(w.x, w.y);
      }
    };
    const zoomAt = (sx, sy, factor) => {
      const before = this.screenToWorld(sx, sy);
      this.zoom = this.clampZoom(this.zoom * factor);
      const after = this.screenToWorld(sx, sy);
      this.x += before.x - after.x;
      this.y += before.y - after.y;
    };

    canvas.addEventListener("mousedown", (e) => startDrag(e.clientX, e.clientY));
    canvas.addEventListener("mousemove", (e) => { if (dragging) doDrag(e.clientX, e.clientY); });
    window.addEventListener("mouseup", (e) => { if (dragging) endDrag(e.clientX, e.clientY); });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, Math.pow(1.0015, -e.deltaY));
    }, { passive: false });

    // Any change in the number of fingers down re-bases whichever
    // gesture reference is now active (drag origin or pinch distance)
    // from the CURRENT touch positions, instead of carrying over a
    // stale value from the previous finger count. Without this, letting
    // go of a pinch (2 fingers -> 1 before the final lift) reused the
    // single-finger drag origin from before the pinch even started,
    // producing a sudden camera jump right as the gesture released.
    //
    // gestureMultiTouch tracks whether *this entire gesture* ever saw a
    // second finger, from first touch down to all fingers lifted. A
    // pinch that drops to one finger still counts: rebase()'s 1-finger
    // branch calls startDrag(), which resets `moved` to false, so
    // without re-asserting it here a quick final release would read as
    // a plain tap and select whatever was under that last finger, even
    // though the whole gesture was a pinch-zoom, not a tap.
    let touchCount = 0;
    let gestureMultiTouch = false;
    const rebase = (touches) => {
      if (touches.length >= 2) {
        dragging = false;
        gestureMultiTouch = true;
        pinchDist = dist(touches[0], touches[1]);
        moved = true;
      } else if (touches.length === 1) {
        pinchDist = 0;
        const c = center(touches);
        if (!dragging || touchCount >= 2) {
          startDrag(c.x, c.y);
          if (gestureMultiTouch) moved = true;
        } else {
          lastX = c.x; lastY = c.y;
        }
      } else {
        pinchDist = 0;
      }
      touchCount = touches.length;
    };

    canvas.addEventListener("touchstart", (e) => rebase(e.touches), { passive: true });
    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches.length >= 2) {
        const d = dist(e.touches[0], e.touches[1]);
        const c = center(e.touches);
        if (pinchDist > 0) zoomAt(c.x, c.y, d / pinchDist);
        pinchDist = d;
      } else if (e.touches.length === 1 && dragging) {
        const c = center(e.touches);
        doDrag(c.x, c.y);
      }
    }, { passive: false });
    canvas.addEventListener("touchend", (e) => {
      if (e.touches.length === 0) {
        pinchDist = 0;
        touchCount = 0;
        const t = e.changedTouches[0];
        if (t) endDrag(t.clientX, t.clientY);
        else dragging = false;
        gestureMultiTouch = false; // gesture fully over; next touch starts fresh
      } else {
        rebase(e.touches);
      }
    });
  }
}


// ==== ui.js ====
// ui.js - the bottom-sheet dispatch terminal. Plain functions over the
// current fleet/graph state, not a class with its own persistent copy of
// everything - main.js already owns that state and just calls in here
// to (re)render whenever something changes. Real CSS classes throughout
// (no inline-styled template strings).
"use strict";



const uiEl = {
  sheet: document.getElementById("bottom-sheet"),
  handle: document.getElementById("sheet-handle"),
  tabs: document.querySelectorAll(".tab-btn"),
  overview: document.getElementById("tab-overview"),
  rankings: document.getElementById("tab-rankings"),
  economy: document.getElementById("tab-economy"),
  detailsEmpty: document.getElementById("details-empty"),
  detailsData: document.getElementById("details-data"),
};

let onSelectTruck = null;
let onSpotlightCargo = null;
let onToggleControl = null;
// Fired whenever which panel is on screen changes (tab switch, or the
// sheet being collapsed/expanded). main.js only refreshes the visible tab
// now, so it needs to know to render the newly-revealed one right away
// instead of leaving it blank until the next periodic tick.
let onVisibleTabChange = null;
let dispatchDrill = null; // null = the Dispatch summary cards; "corridors" | "interstates" = drilled into that ranking
let rankingsDrillKey = null; // null = the Rankings leader cards; a key (possibly "city:"-prefixed) = drilled into that ranking
let selectedCityName = null; // set once a city is picked out of a city ranking - replaces the Rankings tab with that city's full page
let lastTrucks = [];
let lastGraph = null;

function initUI(callbacks) {
  onSelectTruck = callbacks.onSelectTruck;
  onToggleControl = callbacks.onToggleControl;
  onSpotlightCargo = callbacks.onSpotlightCargo;
  onVisibleTabChange = callbacks.onVisibleTabChange;

  // Tapping a cargo row spotlights that cargo type on the map. Delegated
  // like the other panels, since the Economy tab is rebuilt wholesale on
  // every refresh.
  uiEl.economy.addEventListener("click", (e) => {
    const row = e.target.closest("[data-cargo]");
    if (row && onSpotlightCargo) onSpotlightCargo(row.dataset.cargo);
  });

  uiEl.handle.addEventListener("click", () => {
    uiEl.sheet.classList.toggle("minimized");
    // Expanding the sheet reveals a panel that has not been refreshed
    // while it was hidden, so it needs the same immediate rebuild a tab
    // switch gets.
    if (onVisibleTabChange) onVisibleTabChange();
  });
  uiEl.tabs.forEach((btn) => {
    btn.addEventListener("click", () => openTab(btn.dataset.tab));
  });

  // Delegated: each tab's content is fully rebuilt on every refresh, so
  // its click targets are wired here once against the stable parent
  // rather than re-attached per render.
  uiEl.overview.addEventListener("click", (e) => {
    const drillCard = e.target.closest("[data-drill]");
    const chip = e.target.closest("[data-chip]");
    const back = e.target.closest("[data-back]");
    if (!drillCard && !chip && !back) return;

    if (drillCard) dispatchDrill = drillCard.dataset.drill;
    else if (chip) dispatchDrill = chip.dataset.chip;
    else dispatchDrill = null; // back out of a ranking to the summary cards

    renderDispatchTab(lastTrucks, lastGraph);
    uiEl.overview.scrollTop = 0;
  });

  uiEl.rankings.addEventListener("click", (e) => {
    const drillCard = e.target.closest("[data-drill]");
    const chip = e.target.closest("[data-chip]");
    const cityRow = e.target.closest("[data-city]");
    const back = e.target.closest("[data-back]");
    if (!drillCard && !chip && !cityRow && !back) return;

    if (drillCard) { rankingsDrillKey = drillCard.dataset.drill; selectedCityName = null; }
    else if (chip) { rankingsDrillKey = chip.dataset.chip; selectedCityName = null; }
    else if (cityRow) { selectedCityName = cityRow.dataset.city; }
    else if (selectedCityName) { selectedCityName = null; } // back out of a city page to its ranking list
    else { rankingsDrillKey = null; } // back out of a ranking to the leader cards

    renderRankingsTab(lastTrucks, lastGraph);
    // Rebuilding the panel's innerHTML doesn't reset its own scroll
    // position, so navigating between leader-cards/ranking/city views
    // from partway down the previous one left the new (shorter) content
    // starting mid-scroll instead of at its own top.
    uiEl.rankings.scrollTop = 0;
  });

  uiEl.detailsData.addEventListener("click", (e) => {
    if (e.target.closest("[data-control-toggle]")) onToggleControl && onToggleControl();
  });
}

// Called when the sim restarts under new settings: the old fleet/graph
// this panel was showing (a drilldown, a selected city page, cached
// trucks/graph references) no longer apply to the fresh run.
function resetUIState() {
  dispatchDrill = null;
  rankingsDrillKey = null;
  selectedCityName = null;
  lastTrucks = [];
  lastGraph = null;
  uiEl.detailsEmpty.classList.remove("hidden");
  uiEl.detailsData.classList.add("hidden");
  uiEl.detailsData.innerHTML = "";
}

// Which tab's panel is on screen. Only that one is worth re-rendering on
// the periodic refresh - rebuilding the DOM of two hidden panels 2.5 times
// a second was pure waste, and the rankings ones are the most expensive
// renders in the app. Also tracks whether the sheet is collapsed, since a
// minimized sheet shows no panel at all.
let activeTabName = "overview";
function visibleTab() {
  return uiEl.sheet.classList.contains("minimized") ? null : activeTabName;
}

function openTab(name) {
  uiEl.sheet.classList.remove("minimized");
  activeTabName = name;
  if (onVisibleTabChange) onVisibleTabChange();
  uiEl.tabs.forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".content-panel").forEach((p) => p.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
}

// User explicitly tapped a truck/city: switch to the Details tab and render.
function openDetailsFor(entity, kind, isControlled, trucks, graph) {
  openTab("details");
  if (kind === "truck") renderTruckDetails(entity, isControlled);
  else renderCityDetails(entity, graph, trucks);
}

// Per-frame refresh of the followed truck's numbers - does NOT switch
// tabs, so it stays live (speed/miles/ETA ticking) without yanking the
// player back to Details if they've navigated elsewhere.
function refreshFollowedTruckDetails(truck, isControlled) {
  renderTruckDetails(truck, isControlled);
}

// Periodic refresh of a viewed city's live stats (inbound/outbound
// traffic changes as the fleet moves) - same idea, no tab switch.
function refreshViewedCityDetails(city, graph, trucks) {
  if (city) renderCityDetails(city, graph, trucks);
}

function metricCard(title, value, sub, tone, drillKey) {
  const div = document.createElement("div");
  div.className = "metric-card" + (tone ? " " + tone : "");
  if (drillKey) div.dataset.drill = drillKey;
  div.innerHTML = `<div class="metric-title">${title}</div><div class="metric-value">${value}</div><div class="metric-sub">${sub}</div>`;
  return div;
}

// Remaining distance to a truck's contract destination: the tail of its
// current edge (or the full length of pendingEdge, while briefly stopped
// waiting for a gap to depart a city) plus every edge still queued in
// remainingPath.
function etaMilesOf(t) {
  // A truck on a layover has no run in progress. Returning 0 would rank it
  // as the closest thing in the fleet to arriving, which is exactly wrong -
  // it would dominate the "Closest to Arrival" board with trucks that are
  // parked and not going anywhere yet.
  if (t.parkedAt) return Infinity;
  const currentLeg = t.edge ? t.edge.miles - t.s : (t.pendingEdge ? t.pendingEdge.miles : 0);
  return Math.max(0, currentLeg) + t.remainingPath.reduce((s, e) => s + e.miles, 0);
}

// Combines both directions of the same physical road segment (from/to
// sorted) so a corridor's congestion count doesn't split by which way
// trucks happen to be driving on it. Sorted descending - [0] is the
// single busiest corridor, the full array backs its ranking drilldown.
function corridorCounts(trucks) {
  const counts = new Map();
  for (const t of trucks) {
    if (!t.edge) continue;
    const key = [t.edge.from, t.edge.to].sort().join("|") + "|" + t.edge.route;
    const rec = counts.get(key) || { count: 0, edge: t.edge };
    rec.count++;
    counts.set(key, rec);
  }
  return [...counts.values()].sort((a, b) => b.count - a.count);
}

// A physical route like I-76 can be split into two non-contiguous
// segments in the data (route names "I-76 (West)"/"I-76 (East)") - this
// strips that suffix so both halves roll up into one "I-76" total.
function baseRouteName(route) {
  return route.replace(" (West)", "").replace(" (East)", "");
}

// Every truck currently on an interstate, tallied by which interstate
// (both directions, all corridors of that route combined) - "busiest
// interstate overall" rather than "busiest single segment".
function interstateCounts(trucks) {
  const counts = new Map();
  for (const t of trucks) {
    if (!t.edge || t.edge.kind !== "interstate") continue;
    const key = baseRouteName(t.edge.route);
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  return [...counts.entries()].map(([route, count]) => ({ route, count })).sort((a, b) => b.count - a.count);
}

function uiShieldLabel(route) {
  return route.replace("US-", "US ").replace(" (West)", "").replace(" (East)", "");
}

// A periodic (every ~400ms) refresh tears down and rebuilds a panel's
// innerHTML wholesale, which by default resets any scroll position -
// most jarringly the chip-row's horizontal scroll snapping back to its
// start mid-swipe. Wrapping a render call in this preserves both the
// panel's own vertical scroll and any chip-row's horizontal scroll
// across that rebuild; explicit navigation (tapping into/out of a
// ranking) still resets scroll afterward via its own click handler,
// which runs after and overrides this.
function preserveScroll(container, renderFn) {
  const scrollTop = container.scrollTop;
  const chipScrollLeft = container.querySelector(".chip-row")?.scrollLeft;
  renderFn();
  container.scrollTop = scrollTop;
  if (chipScrollLeft != null) {
    const chipRow = container.querySelector(".chip-row");
    if (chipRow) chipRow.scrollLeft = chipScrollLeft;
  }
}

// Every stat a truck can be ranked by. Each shows up as one leader card
// on the Dispatch overview (name of the #1 truck + its value); tapping
// that card drills into the full top-10 for that stat.
const TRUCK_STATS = {
  earnings: { label: "Top Earners", dir: "desc", get: (t) => t.earnings, fmt: (v) => "$" + Math.round(v).toLocaleString(), unit: "" },
  speed: { label: "Fastest", dir: "desc", get: (t) => t.speed, fmt: (v) => Math.round(v), unit: " mph" },
  routeMiles: { label: "Longest Route", dir: "desc", get: (t) => t.contract.optimalMiles, fmt: (v) => Math.round(v).toLocaleString(), unit: " mi" },
  totalMiles: { label: "Most Miles", dir: "desc", get: (t) => t.totalMilesDriven, fmt: (v) => Math.round(v).toLocaleString(), unit: " mi" },
  trips: { label: "Most Trips", dir: "desc", get: (t) => t.contractsCompleted, fmt: (v) => v, unit: "" },
  etaMiles: { label: "Closest to Arrival", dir: "asc", get: (t) => etaMilesOf(t), fmt: (v) => Math.round(v).toLocaleString(), unit: " mi left" },
  payout: { label: "Highest Payout", dir: "desc", get: (t) => t.contract.payout, fmt: (v) => "$" + Math.round(v).toLocaleString(), unit: "" },
};

// Same idea, for cities. population is static (from data.js); inbound/
// outbound are live counts over the current fleet.
//
// `get` here takes a PRECOMPUTED tally rather than the raw truck array, and
// that is load-bearing, not a style choice. These used to run
// `trucks.filter(...)` inside the sort comparator, which made ranking the
// ~343 cities cost O(cities x log(cities) x trucks): roughly 2,900
// comparisons, each scanning all 3,000 trucks twice and allocating two
// throwaway arrays. That is ~17 million truck visits per ranking, two
// rankings per refresh, 2.5 refreshes a second - and it measured at 21-23%
// of total CPU in a profile at 3,000 trucks. Tallying once up front makes
// it O(trucks + cities x log(cities)) instead.
const CITY_STATS = {
  population: { label: "Largest Cities", dir: "desc", get: (c) => c.pop || 0, fmt: (v) => v.toLocaleString(), unit: "" },
  inbound: { label: "Most Inbound Traffic", dir: "desc", get: (c, tally) => tally.inbound.get(c.name) || 0, fmt: (v) => v, unit: " inbound" },
  outbound: { label: "Most Outbound Traffic", dir: "desc", get: (c, tally) => tally.outbound.get(c.name) || 0, fmt: (v) => v, unit: " outbound" },
};

// One pass over the fleet produces both counts for every city at once.
// Deliberately NOT cached across calls: a tally is a single 3,000-element
// scan, and contracts turn over constantly, so caching it would trade a
// negligible saving for a real risk of showing stale counts.
function cityTally(trucks) {
  const inbound = new Map(), outbound = new Map();
  for (const t of trucks) {
    const d = t.contract.destination, o = t.contract.origin;
    inbound.set(d, (inbound.get(d) || 0) + 1);
    outbound.set(o, (outbound.get(o) || 0) + 1);
  }
  return { inbound, outbound };
}

// Only the single leader is ever needed for the summary cards, so take it
// in one linear scan rather than copying and fully sorting the fleet.
// Sorting 3,000 trucks is ~34,600 comparisons; this is 3,000.
function leaderTruckBy(trucks, key) {
  const stat = TRUCK_STATS[key];
  const asc = stat.dir === "asc";
  let best = null, bestV = 0;
  for (const t of trucks) {
    const v = stat.get(t);
    if (best === null || (asc ? v < bestV : v > bestV)) { best = t; bestV = v; }
  }
  return best;
}

function sortedTrucksBy(trucks, key) {
  const stat = TRUCK_STATS[key];
  // Decorate-sort-undecorate: stat.get runs once per truck instead of
  // twice per comparison. For etaMiles in particular that matters a lot -
  // its getter walks the truck's whole remaining path.
  const decorated = trucks.map((t) => ({ t, v: stat.get(t) }));
  decorated.sort(stat.dir === "asc" ? (a, b) => a.v - b.v : (a, b) => b.v - a.v);
  return decorated.map((d) => d.t);
}

// The set of real cities is fixed for the life of the graph, so build the
// array once instead of filtering 375 nodes on every ranking render.
const realCitiesCache = new WeakMap();
function realCities(graph) {
  let list = realCitiesCache.get(graph);
  if (!list) {
    list = Object.values(graph.nodes).filter((n) => n.t > 0);
    realCitiesCache.set(graph, list);
  }
  return list;
}

function sortedCitiesBy(graph, trucks, key) {
  const stat = CITY_STATS[key];
  const tally = cityTally(trucks);
  const decorated = realCities(graph).map((c) => ({ c, v: stat.get(c, tally) }));
  decorated.sort(stat.dir === "asc" ? (a, b) => a.v - b.v : (a, b) => b.v - a.v);
  return decorated.map((d) => d.c);
}

function listRow(rank, mainText, subText, valueText, valueUnit, onClick, dataAttr) {
  const div = document.createElement("div");
  div.className = "list-row";
  if (dataAttr) div.dataset[dataAttr[0]] = dataAttr[1];
  div.innerHTML = `<div class="row-rank">${rank}</div>
    <div><div class="row-main">${mainText}</div><div class="row-sub">${subText}</div></div>
    <div class="row-value">${valueText}${valueUnit ? `<span class="row-value-unit">${valueUnit}</span>` : ""}</div>`;
  if (onClick) div.addEventListener("click", onClick);
  return div;
}

function renderDispatchTab(trucks, graph) {
  lastTrucks = trucks;
  lastGraph = graph;
  if (!trucks.length || !graph) { uiEl.overview.innerHTML = ""; return; }

  preserveScroll(uiEl.overview, () => {
    uiEl.overview.innerHTML = "";
    if (dispatchDrill) { renderRoadDrilldown(trucks, dispatchDrill); return; }

    const moving = trucks.filter((t) => t.edge);
    const avgSpeed = moving.length ? moving.reduce((s, t) => s + t.speed, 0) / moving.length : 0;
    const totalEarnings = trucks.reduce((s, t) => s + t.earnings, 0);
    const totalMiles = trucks.reduce((s, t) => s + t.totalMilesDriven, 0);
    const totalTrips = trucks.reduce((s, t) => s + t.contractsCompleted, 0);
    const cargoCounts = {};
    for (const t of trucks) cargoCounts[t.contract.truckType.label] = (cargoCounts[t.contract.truckType.label] || 0) + 1;
    const topType = Object.entries(cargoCounts).sort((a, b) => b[1] - a[1])[0];
    const corridors = corridorCounts(trucks);
    const corridor = corridors[0];
    const interstates = interstateCounts(trucks);
    const topInterstate = interstates[0];

    const grid = document.createElement("div");
    grid.className = "metric-grid";
    grid.appendChild(metricCard("Active Fleet", trucks.length, `${moving.length} rolling`));
    grid.appendChild(metricCard("Network Speed", Math.round(avgSpeed) + " mph", "fleet average"));
    grid.appendChild(metricCard("Total Earnings", "$" + Math.round(totalEarnings).toLocaleString(), "all-time"));
    grid.appendChild(metricCard("Miles Logged", Math.round(totalMiles).toLocaleString(), "all-time"));
    grid.appendChild(metricCard("Contracts Done", totalTrips.toLocaleString(), "all-time"));
    grid.appendChild(metricCard("Top Cargo", topType ? topType[0] : "—", topType ? `${topType[1]} trucks` : ""));
    grid.appendChild(metricCard("Busiest Corridor", corridor ? uiShieldLabel(corridor.edge.route) : "—", corridor ? `near ${corridor.edge.control} • ${corridor.count} trucks` : "", "info", "corridors"));
    grid.appendChild(metricCard("Busiest Interstate", topInterstate ? uiShieldLabel(topInterstate.route) : "—", topInterstate ? `${topInterstate.count} trucks total` : "", "info", "interstates"));
    uiEl.overview.appendChild(grid);
  });
}

const ROAD_DRILL_LABEL = { corridors: "Busiest Corridors", interstates: "Busiest Interstates" };

// Dispatch's own (much smaller) drilldown - just the two road-traffic
// rankings, so it gets a simple 2-way chip toggle rather than pulling in
// the full Rankings-tab machinery for two categories.
function renderRoadDrilldown(trucks, key) {
  const header = document.createElement("div");
  header.className = "detail-header";
  header.style.marginTop = "2px";
  header.innerHTML = `<button class="pill-btn" data-back style="background:var(--panel-strong);color:var(--ink)">&larr; Back</button>
    <div class="detail-title" style="font-size:1rem;">${ROAD_DRILL_LABEL[key]}</div><span></span>`;
  uiEl.overview.appendChild(header);

  const chipRow = document.createElement("div");
  chipRow.className = "chip-row";
  for (const k in ROAD_DRILL_LABEL) {
    const chip = document.createElement("button");
    chip.className = "chip" + (k === key ? " active" : "");
    chip.dataset.chip = k;
    chip.textContent = ROAD_DRILL_LABEL[k];
    chipRow.appendChild(chip);
  }
  uiEl.overview.appendChild(chipRow);

  const list = document.createElement("div");
  if (key === "corridors") {
    corridorCounts(trucks).slice(0, 10).forEach((rec, i) => {
      list.appendChild(listRow(i + 1, uiShieldLabel(rec.edge.route), `near ${rec.edge.control}`, rec.count, " trucks"));
    });
  } else {
    interstateCounts(trucks).slice(0, 10).forEach((rec, i) => {
      list.appendChild(listRow(i + 1, uiShieldLabel(rec.route), "all corridors", rec.count, " trucks"));
    });
  }
  uiEl.overview.appendChild(list);
}

function renderRankingsTab(trucks, graph) {
  if (!trucks.length || !graph) { uiEl.rankings.innerHTML = ""; return; }

  preserveScroll(uiEl.rankings, () => {
    uiEl.rankings.innerHTML = "";
    if (selectedCityName) { renderCityPage(graph.nodes[selectedCityName], graph, trucks); return; }
    if (rankingsDrillKey) { renderDrilldown(trucks, graph, rankingsDrillKey); return; }

    const fleetLabel = document.createElement("div");
    fleetLabel.className = "section-label";
    fleetLabel.textContent = "Fleet Leaderboards — tap to see the full ranking";
    uiEl.rankings.appendChild(fleetLabel);

    const fleetGrid = document.createElement("div");
    fleetGrid.className = "metric-grid";
    for (const key in TRUCK_STATS) {
      const stat = TRUCK_STATS[key];
      const leader = leaderTruckBy(trucks, key);
      const card = document.createElement("div");
      card.className = "metric-card good";
      card.dataset.drill = key;
      card.innerHTML = `<div class="metric-title">${stat.label}</div><div class="metric-value">${stat.fmt(stat.get(leader))}${stat.unit}</div><div class="metric-sub">${leader.name}</div>`;
      fleetGrid.appendChild(card);
    }
    uiEl.rankings.appendChild(fleetGrid);

    const cityLabel = document.createElement("div");
    cityLabel.className = "section-label";
    cityLabel.textContent = "City Rankings — tap to see the full list";
    uiEl.rankings.appendChild(cityLabel);

    const cityGrid = document.createElement("div");
    cityGrid.className = "metric-grid";
    const cardTally = cityTally(trucks);
    for (const key in CITY_STATS) {
      const stat = CITY_STATS[key];
      const leader = sortedCitiesBy(graph, trucks, key)[0];
      const card = document.createElement("div");
      card.className = "metric-card info";
      card.dataset.drill = "city:" + key;
      card.innerHTML = `<div class="metric-title">${stat.label}</div><div class="metric-value">${stat.fmt(stat.get(leader, cardTally))}${stat.unit}</div><div class="metric-sub">${leader.name}</div>`;
      cityGrid.appendChild(card);
    }
    uiEl.rankings.appendChild(cityGrid);
  });
}

function renderDrilldown(trucks, graph, key) {
  if (key.startsWith("city:")) { renderCityDrilldown(trucks, graph, key.slice(5)); return; }

  const stat = TRUCK_STATS[key];
  const header = document.createElement("div");
  header.className = "detail-header";
  header.style.marginTop = "2px";
  header.innerHTML = `<button class="pill-btn" data-back style="background:var(--panel-strong);color:var(--ink)">&larr; Back</button>
    <div class="detail-title" style="font-size:1rem;">${stat.label}</div><span></span>`;
  uiEl.rankings.appendChild(header);

  const chipRow = document.createElement("div");
  chipRow.className = "chip-row";
  for (const k in TRUCK_STATS) {
    const chip = document.createElement("button");
    chip.className = "chip" + (k === key ? " active" : "");
    chip.dataset.chip = k;
    chip.textContent = TRUCK_STATS[k].label;
    chipRow.appendChild(chip);
  }
  uiEl.rankings.appendChild(chipRow);

  const list = document.createElement("div");
  sortedTrucksBy(trucks, key).slice(0, 10).forEach((t, i) => {
    list.appendChild(listRow(
      i + 1,
      t.name,
      `${t.currentNode} → ${t.contract.destination}`,
      stat.fmt(stat.get(t)),
      stat.unit,
      () => onSelectTruck && onSelectTruck(t)
    ));
  });
  uiEl.rankings.appendChild(list);
}

function cityTierLabel(t) {
  return { 1: "Major Hub", 2: "Regional Center", 3: "Secondary Market", 4: "Local Market" }[t] || "Waypoint";
}

function renderCityDrilldown(trucks, graph, key) {
  const stat = CITY_STATS[key];
  const header = document.createElement("div");
  header.className = "detail-header";
  header.style.marginTop = "2px";
  header.innerHTML = `<button class="pill-btn" data-back style="background:var(--panel-strong);color:var(--ink)">&larr; Back</button>
    <div class="detail-title" style="font-size:1rem;">${stat.label}</div><span></span>`;
  uiEl.rankings.appendChild(header);

  const chipRow = document.createElement("div");
  chipRow.className = "chip-row";
  for (const k in CITY_STATS) {
    const chip = document.createElement("button");
    chip.className = "chip" + (k === key ? " active" : "");
    chip.dataset.chip = "city:" + k;
    chip.textContent = CITY_STATS[k].label;
    chipRow.appendChild(chip);
  }
  uiEl.rankings.appendChild(chipRow);

  const list = document.createElement("div");
  const listTally = cityTally(trucks);
  sortedCitiesBy(graph, trucks, key).slice(0, 10).forEach((c, i) => {
    list.appendChild(listRow(
      i + 1,
      c.name,
      cityTierLabel(c.t),
      stat.fmt(stat.get(c, listTally)),
      stat.unit,
      null,
      ["city", c.name]
    ));
  });
  uiEl.rankings.appendChild(list);
}

// The rich per-city page, embedded directly in the Rankings tab in place
// of whichever city ranking the player drilled through to get here.
function renderCityPage(city, graph, trucks) {
  const header = document.createElement("div");
  header.className = "detail-header";
  header.style.marginTop = "2px";
  header.innerHTML = `<button class="pill-btn" data-back style="background:var(--panel-strong);color:var(--ink)">&larr; Back</button><span></span>`;
  uiEl.rankings.appendChild(header);

  const wrap = document.createElement("div");
  wrap.innerHTML = cityDetailsHTML(city, graph, trucks);
  uiEl.rankings.appendChild(wrap);
}

// Shared by the Dispatch-tab city page and the Unit-tab city view (via
// map tap) so both read from one accurate, consistently formatted source.
function cityDetailsHTML(city, graph, trucks) {
  const inbound = trucks.filter((t) => t.contract.destination === city.name);
  const outbound = trucks.filter((t) => t.contract.origin === city.name);
  const allReal = realCities(graph);
  const popRank = city.pop ? allReal.filter((c) => (c.pop || 0) > city.pop).length + 1 : null;

  const cargoCounts = {};
  for (const t of inbound) cargoCounts[t.contract.truckType.label] = (cargoCounts[t.contract.truckType.label] || 0) + 1;
  const topInbound = Object.entries(cargoCounts).sort((a, b) => b[1] - a[1])[0];

  return `
    <div class="detail-header">
      <div>
        <div class="detail-title">${city.name}</div>
        <div class="detail-sub">${cityTierLabel(city.t)} • Tier ${city.t}${popRank ? ` • #${popRank} by population` : ""}</div>
      </div>
    </div>
    <div class="metric-grid" style="margin-bottom:12px;">
      <div class="metric-card"><div class="metric-title">Population</div><div class="metric-value">${city.pop ? city.pop.toLocaleString() : "—"}</div></div>
      <div class="metric-card"><div class="metric-title">Freight Weight</div><div class="metric-value">${city.w}</div></div>
      <div class="metric-card good"><div class="metric-title">Inbound Now</div><div class="metric-value">${inbound.length}</div><div class="metric-sub">trucks headed here</div></div>
      <div class="metric-card info"><div class="metric-title">Outbound Now</div><div class="metric-value">${outbound.length}</div><div class="metric-sub">trucks just departed</div></div>
    </div>
    ${topInbound ? `<div class="detail-sub" style="margin-bottom:10px;">Top inbound cargo: <strong style="color:var(--ink)">${topInbound[0]}</strong> (${topInbound[1]} truck${topInbound[1] === 1 ? "" : "s"})</div>` : ""}
    <div class="detail-sub">${(city.ind || []).join(", ") || "No industry data"}</div>
    ${customsBlockHTML(city, graph)}
  `;
}

// Border-crossing detail, shown only for a city with at least one border
// edge (graph.adjacency already flags isBorder/borderType per edge - see
// geo.js's ingestRouteTable). One sub-block per distinct crossing (a city
// could theoretically sit on more than one, though none do today) with
// both directions' live queue, since a border town's OWN queue is keyed
// by ITS name in the crossing's queues map (see fleet.js's _enterCustoms)
// while the far side's is keyed by the other city's name.
function customsBlockHTML(city, graph) {
  const borderEdges = (graph.adjacency[city.name] || []).filter((e) => e.isBorder);
  if (!borderEdges.length) return "";
  const crossings = getBorderCrossings();
  const seen = new Set();
  const blocks = [];
  for (const edge of borderEdges) {
    if (seen.has(edge.borderName)) continue;
    seen.add(edge.borderName);
    const crossing = crossings.get(edge.borderName);
    const otherCity = edge.to;
    const outQueue = crossing?.queues.get(city.name) || [];
    const inQueue = crossing?.queues.get(otherCity) || [];
    const isUrban = edge.borderType === "urban";
    const nextNames = outQueue.slice(0, 3).map((t) => t.name).join(", ");
    blocks.push(`
      <div class="customs-block">
        <div class="customs-title">Customs — ${edge.borderName}</div>
        <div class="detail-sub">${isUrban ? "Urban crossing" : "Rural crossing"} &bull; avg. ${isUrban ? "~15 min" : "~1.5h"} per truck</div>
        <div class="detail-sub">${city.name} → ${otherCity}: <strong class="ink">${outQueue.length}</strong> waiting</div>
        <div class="detail-sub">${otherCity} → ${city.name}: <strong class="ink">${inQueue.length}</strong> waiting</div>
        ${nextNames ? `<div class="detail-sub">Next in line: ${nextNames}</div>` : ""}
      </div>
    `);
  }
  return blocks.join("");
}

}

// ---------------------------------------------------------------------
// Economy tab
//
// Chart design notes, since these decisions are load-bearing rather than
// cosmetic:
//  * Every trend here is a SINGLE series, so each gets one hue and no
//    legend - the title names it. The two hues (#b8802a money, #4780cc
//    operations) were picked by running them through a palette validator
//    against this panel's own surface (#1b212a): both sit inside the dark
//    lightness band, clear the chroma floor, hold ~24 dE separation under
//    protanopia/tritanopia, and pass 3:1 contrast.
//  * The cargo bars are ONE colour, not seven. A bar chart of "revenue by
//    cargo type" is a single measure, and giving each bar its own hue
//    would burn the colour channel re-encoding what bar length already
//    says. The cargo's own map colour appears as a small chip beside the
//    label instead, so identity still ties back to the map without the
//    quantitative encoding depending on it - which matters because the
//    cargo palette itself fails CVD separation (Flatbed vs Tanker are
//    only dE 11 apart even in normal vision).
//  * No hover tooltips: this panel is rebuilt every ~400ms while the sim
//    runs, so hover state cannot survive a refresh. Direct labels on the
//    endpoint and on every bar carry the same information statically.
// ---------------------------------------------------------------------
const CHART_MONEY = "#b8802a";
const CHART_OPS = "#4780cc";

// Ring-buffer samples arrive oldest-first as
// { min, earnings, contracts, avgSpeed, rolling }.
function seriesFrom(history, pick) {
  const out = [];
  for (let i = 1; i < history.length; i++) {
    const a = history[i - 1], b = history[i];
    const hours = (b.min - a.min) / 60;
    if (hours <= 0) continue;
    out.push(pick(a, b, hours));
  }
  return out;
}

// Centred moving average. Per-sample rates are genuinely spiky - a
// 15-game-minute window catches whatever handful of contracts happened to
// land in it - and an unsmoothed line renders as a hairball that hides the
// very trend the chart exists to show. The section is labelled "smoothed"
// so this isn't passed off as raw data.
function smooth(values, window = 5) {
  if (values.length < window) return values;
  const half = Math.floor(window / 2);
  const out = new Array(values.length);
  for (let i = 0; i < values.length; i++) {
    let sum = 0, n = 0;
    for (let j = Math.max(0, i - half); j <= Math.min(values.length - 1, i + half); j++) { sum += values[j]; n++; }
    out[i] = sum / n;
  }
  return out;
}

// A single-series sparkline: hairline baseline, soft area fill, 2px line,
// one endpoint marker, and a direct label only at that endpoint.
function sparkline(values, color, w = 240, h = 52) {
  if (values.length < 2) {
    return `<div class="chart-empty">gathering data…</div>`;
  }
  let min = Infinity, max = -Infinity;
  for (const v of values) { if (v < min) min = v; if (v > max) max = v; }
  if (max - min < 1e-9) { max = min + 1; }
  const pad = (max - min) * 0.12;
  min -= pad; max += pad;
  const x = (i) => (i / (values.length - 1)) * (w - 2) + 1;
  const y = (v) => h - 6 - ((v - min) / (max - min)) * (h - 14);
  let d = "", area = `M ${x(0)} ${h - 2}`;
  for (let i = 0; i < values.length; i++) {
    d += `${i ? "L" : "M"} ${x(i).toFixed(1)} ${y(values[i]).toFixed(1)} `;
    area += ` L ${x(i).toFixed(1)} ${y(values[i]).toFixed(1)}`;
  }
  area += ` L ${x(values.length - 1)} ${h - 2} Z`;
  const lastX = x(values.length - 1), lastY = y(values[values.length - 1]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img">
    <line x1="0" y1="${h - 2}" x2="${w}" y2="${h - 2}" class="spark-axis"/>
    <path d="${area}" fill="${color}" opacity="0.14"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="${color}"/>
  </svg>`;
}

function trendCard(title, values, color, currentText) {
  return `<div class="chart-card">
    <div class="chart-head"><span class="chart-title">${title}</span><span class="chart-now">${currentText}</span></div>
    ${sparkline(smooth(values), color)}
  </div>`;
}

// Horizontal bars: one hue, rounded outer end, 2px gaps, direct value on
// each row, and the cargo's map colour as an identity chip.
function barChart(rows, unitFmt, spotlight) {
  const max = Math.max(...rows.map((r) => r.value), 1);
  return rows.map((r) => {
    const pct = Math.max(1.5, (r.value / max) * 100);
    const on = spotlight === r.id;
    return `<div class="cargo-row${on ? " spotlit" : ""}" data-cargo="${r.id}" title="Tap to spotlight ${r.label} on the map">
      <span class="cargo-chip" style="background:${r.color}"></span>
      <span class="cargo-name">${r.label}</span>
      <span class="cargo-track"><span class="cargo-bar" style="width:${pct.toFixed(1)}%"></span></span>
      <span class="cargo-val">${unitFmt(r.value)}</span>
    </div>`;
  }).join("");
}

function renderEconomyTab(trucks, graph, history, spotlight) {
  if (!trucks.length) { uiEl.economy.innerHTML = ""; return; }

  preserveScroll(uiEl.economy, () => {
    const revPerHr = seriesFrom(history, (a, b, h) => (b.earnings - a.earnings) / h);
    const conPerHr = seriesFrom(history, (a, b, h) => (b.contracts - a.contracts) / h);
    const speed = history.slice(1).map((s) => s.avgSpeed);
    const rolling = history.slice(1).map((s) => s.rolling);

    const last = (arr) => (arr.length ? arr[arr.length - 1] : 0);
    const money = (v) => "$" + Math.round(v).toLocaleString();

    // Per-cargo aggregates in one pass over the fleet.
    const agg = new Map();
    for (const t of trucks) {
      const tt = t.contract.truckType;
      let a = agg.get(tt.id);
      if (!a) { a = { id: tt.id, label: tt.label, color: tt.color, count: 0, payout: 0, earned: 0 }; agg.set(tt.id, a); }
      a.count++;
      a.payout += t.contract.payout;
      a.earned += t.earnings;
    }
    const byCount = [...agg.values()].map((a) => ({ ...a, value: a.count })).sort((x, y) => y.value - x.value);
    // Average payout per load, NOT total revenue - total would just
    // restate the fleet mix, whereas this answers "which freight is
    // actually worth hauling" independent of how many you run.
    const byPayout = [...agg.values()].map((a) => ({ ...a, value: a.payout / a.count })).sort((x, y) => y.value - x.value);

    uiEl.economy.innerHTML = `
      <div class="section-label">Trends &mdash; last 48 sim hours, smoothed</div>
      <div class="chart-grid">
        ${trendCard("Revenue / hr", revPerHr, CHART_MONEY, money(last(revPerHr)) + "/hr")}
        ${trendCard("Contracts / hr", conPerHr, CHART_MONEY, last(conPerHr).toFixed(1) + "/hr")}
        ${trendCard("Fleet Avg Speed", speed, CHART_OPS, Math.round(last(speed)) + " mph")}
        ${trendCard("Trucks Rolling", rolling, CHART_OPS, Math.round(last(rolling)).toLocaleString())}
      </div>
      <div class="section-label">Fleet Mix &mdash; tap a cargo to spotlight it on the map</div>
      <div class="cargo-chart">${barChart(byCount, (v) => v.toLocaleString(), spotlight)}</div>
      <div class="section-label">Avg Payout per Load</div>
      <div class="cargo-chart">${barChart(byPayout, money, spotlight)}</div>
      ${spotlight ? `<div class="detail-sub" style="margin-top:10px">Spotlighting <strong style="color:var(--ink)">${agg.get(spotlight)?.label || spotlight}</strong> &mdash; tap it again to clear.</div>` : ""}
    `;
  });
}

// on every Apply costs nothing next to respawning the whole fleet anyway.

// map, and shared by reference with both the sim and the renderer.

// id -> truck lookup, rebuilt once whenever `trucks` itself is rebuilt
// (bootSim only) rather than re-scanned with .find() every frame - ids are
// assigned once (Truck constructor's nextId++) and never reused, so the
// cache stays valid for the whole life of a fleet.
let truckById = new Map();

// for the map's label badges. Reused rather than reallocated: at 3000
// trucks this runs 60x a second.
const parkedCounts = new Map();
