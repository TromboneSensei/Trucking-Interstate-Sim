<title>Interstate Fleet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --asphalt: #12161c;
  --panel: #1b212a;
  --panel-strong: #232b36;
  --line: rgba(255, 240, 214, 0.10);
  --ink: #f1f3f5;
  --dim: #8994a3;
  --caution: #e8a33d;
  --caution-ink: #2a1a03;
  --go: #3f9e6c;
  --stop: #d1494a;
  --info: #3f6fb0;

  --font-display: "Oswald", "Arial Narrow", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;

  font-size: 16px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--asphalt);
  color: var(--ink);
  font-family: var(--font-body);
  touch-action: none;
  user-select: none;
}

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--asphalt);
}

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  gap: 8px;
}

/* Top bar reads like an overhead gantry sign: dark panel, a thin amber
   rule underneath instead of a soft shadow, condensed caps for labels,
   tabular mono digits for the clock. */
#top-bar {
  pointer-events: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-bottom: 2px solid var(--caution);
  border-radius: 3px;
  padding: 9px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
.divider { color: var(--dim); font-family: var(--font-display); }
#time-slider { width: 84px; accent-color: var(--caution); }
#time-readout { color: var(--caution); min-width: 2.6em; }

.pill-btn {
  pointer-events: auto;
  background: var(--stop);
  border: 1px solid rgba(0, 0, 0, 0.25);
  border-radius: 3px;
  color: #fff;
  padding: 8px 14px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.pill-btn:active { transform: scale(0.96); }

/* Nav-view toggle - neutral until engaged (unlike the red "release"
   button, this isn't a destructive action), amber/active to match the
   chip/tab "currently selected" convention used elsewhere. */
#btn-nav-toggle { background: var(--panel-strong); color: var(--ink); }
#btn-nav-toggle.active { background: var(--caution); color: var(--caution-ink); }
.hidden { display: none !important; }

/* Settings gear - top-right, outside #hud's centered flex column so it
   can pin to a corner independent of the top-bar's own layout. */
#btn-settings {
  position: fixed;
  top: max(10px, env(safe-area-inset-top));
  right: max(10px, env(safe-area-inset-right));
  z-index: 5;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-bottom: 2px solid var(--caution);
  border-radius: 3px;
  color: var(--ink);
  font-size: 1.15rem;
  line-height: 1;
  cursor: pointer;
}
#btn-settings:active { transform: scale(0.94); }

/* FPS counter - deliberately unobtrusive (no border/background chrome
   like #btn-settings/#top-bar get), top-left mirror of the settings
   gear's corner-pinning. */
#fps-counter {
  position: fixed;
  top: max(8px, env(safe-area-inset-top));
  left: max(8px, env(safe-area-inset-left));
  z-index: 5;
  pointer-events: none;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--dim);
  opacity: 0.7;
}

/* ---------------------------------------------------------------------
   Settings modal - centered card over a dimmed backdrop (distinct from
   the bottom-anchored decision overlay since this holds a full form,
   not a handful of route-choice buttons). Opening it pauses the sim
   (see main.js's state.settingsOpen); Apply tears the fleet down and
   rebuilds it fresh under the new settings.
--------------------------------------------------------------------- */
#settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#settings-panel {
  pointer-events: auto;
  width: min(92vw, 420px);
  max-height: 82vh;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--caution);
  border-radius: 4px;
  padding: 16px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}
#settings-title {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.settings-row label { font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; color: var(--ink); }
.settings-row input[type="number"],
.settings-row select {
  background: var(--panel-strong);
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  padding: 6px 8px;
  width: 100px;
}
.settings-row input[type="range"] { flex: 1; margin-left: 14px; accent-color: var(--caution); }
#setting-default-speed-val { color: var(--caution); font-family: var(--font-mono); font-weight: 600; }

.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch-track {
  position: absolute;
  inset: 0;
  background: var(--panel-strong);
  border: 1px solid var(--line);
  border-radius: 999px;
  pointer-events: none;
  transition: background 0.15s;
}
.switch-track::before {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  left: 2px;
  top: 2px;
  background: var(--dim);
  border-radius: 50%;
  transition: transform 0.15s, background 0.15s;
}
.switch input:checked + .switch-track { background: rgba(232, 163, 61, 0.25); border-color: var(--caution); }
.switch input:checked + .switch-track::before { transform: translateX(18px); background: var(--caution); }

#settings-actions { display: flex; gap: 8px; margin-top: 16px; }
#settings-actions .pill-btn { flex: 1; text-align: center; }

/* ---------------------------------------------------------------------
   Decision overlay - the junction call. Options render as real interstate
   shields: blue field, red cap band, bold white route number - the one
   piece of genuine interactivity in the sim gets the most on-brand prop.
--------------------------------------------------------------------- */
#decision-overlay {
  position: fixed;
  left: 50%;
  bottom: calc(45vh + 16px);
  transform: translateX(-50%);
  width: min(92vw, 480px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px 12px 12px;
  z-index: 8;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
}
#decision-title {
  font-family: var(--font-display);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--caution);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 10px;
}
#decision-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
}
.decision-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: var(--panel-strong);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 6px 8px;
  color: var(--ink);
  cursor: pointer;
  font-family: var(--font-body);
}
.decision-btn:active, .decision-btn:hover { background: #2a3441; border-color: var(--caution); }

.shield {
  position: relative;
  width: 44px;
  height: 40px;
  background: var(--info);
  clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 3px;
}
.shield::before {
  content: "INTERSTATE";
  display: block;
  font-family: var(--font-body);
  font-size: 0.32rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #fff;
  background: var(--stop);
  width: 100%;
  text-align: center;
  padding: 1px 0;
}
.shield .shield-num {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.95rem;
  color: #fff;
  line-height: 1.5;
}
.shield.hwy { background: var(--panel-strong); clip-path: none; border-radius: 3px; border: 2px solid var(--ink); }
.shield.hwy::before { content: ""; display: none; }
.shield.hwy .shield-num { color: var(--ink); padding-top: 8px; }

.decision-btn .dcity { font-size: 0.8rem; font-weight: 700; text-align: center; }
.decision-btn .ddist { font-size: 0.65rem; color: var(--dim); font-family: var(--font-mono); }
.decision-btn .dkey { font-size: 0.62rem; color: var(--caution); font-family: var(--font-mono); }
#decision-timer { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); margin-top: 12px; overflow: hidden; }
#decision-timer-fill { height: 100%; width: 100%; background: var(--caution); transform-origin: left; }

/* ---------------------------------------------------------------------
   Bottom sheet - the dispatch terminal. Hard corners, a caution rule
   across the top, condensed-caps tab bar.
--------------------------------------------------------------------- */
#bottom-sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 45vh;
  max-height: 45vh;
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--panel);
  border-top: 2px solid var(--caution);
  z-index: 6;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4);
}
#bottom-sheet.minimized { transform: translateY(calc(45vh - 56px)); }
#sheet-handle {
  width: 40px; height: 4px;
  background: var(--dim);
  opacity: 0.5;
  border-radius: 2px;
  margin: 9px auto 6px;
  flex-shrink: 0;
  cursor: pointer;
}
#sheet-tabs {
  display: flex;
  flex-shrink: 0;
  border-bottom: 1px solid var(--line);
  padding: 0 8px;
}
.tab-btn {
  flex: 1;
  padding: 10px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--dim);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.tab-btn.active { color: var(--caution); border-bottom-color: var(--caution); }
.tab-content { flex: 1; min-height: 0; overflow: hidden; }
.content-panel { display: none; height: 100%; overflow-y: auto; padding: 12px; }
.content-panel.active { display: block; }
.placeholder-text { color: var(--dim); font-style: italic; text-align: center; padding: 24px 0; }

/* Metric ticket: a manifest-line look - left accent bar instead of a
   uniform border, condensed number, mono unit. */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); gap: 8px; }
.metric-card {
  background: var(--panel-strong);
  border-left: 3px solid var(--caution);
  border-radius: 2px;
  padding: 10px 12px;
  cursor: pointer;
}
.metric-card.good { border-left-color: var(--go); }
.metric-card.info { border-left-color: var(--info); }
.metric-card:active { background: #2a3441; }
.metric-title {
  font-family: var(--font-body);
  font-size: 0.64rem;
  color: var(--dim);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 5px;
}
.metric-value {
  font-family: var(--font-display);
  font-size: 1.28rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.metric-sub {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.section-label {
  font-family: var(--font-display);
  font-size: 0.7rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 14px 2px 6px;
}

/* Sort chip row - the named rankings (Fastest, Top Earners, ...) plus
   room for more; the active one takes the caution accent. */
.chip-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 2px 8px;
  margin: 0 -2px 4px;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  background: var(--panel-strong);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--dim);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 0.72rem;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.chip.active { background: var(--caution); border-color: var(--caution); color: var(--caution-ink); }

.list-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  background: var(--panel-strong);
  border-left: 3px solid transparent;
  border-radius: 2px;
  margin-bottom: 6px;
  cursor: pointer;
}
.list-row:active { background: #2a3441; }
.row-rank {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--dim);
  min-width: 1.6em;
}
.row-main { font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; color: var(--ink); }
.row-sub { font-size: 0.7rem; color: var(--dim); font-weight: 600; }
.row-value {
  margin-left: auto;
  text-align: right;
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--caution);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.row-value .row-value-unit { color: var(--dim); font-size: 0.68rem; margin-left: 2px; }

.detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.detail-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; }
.detail-sub { font-size: 0.8rem; color: var(--dim); }
.detail-sub .ink { color: var(--ink); }
.customs-block { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--panel-strong); }
.customs-title { font-size: 0.8rem; font-weight: 600; color: #4dabf7; margin-bottom: 2px; } /* matches render.js's CUSTOMS_BADGE_COLOR */
.stat-bar-row { margin-bottom: 10px; }
.stat-bar-label {
  display: flex; justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.7rem; color: var(--dim); font-weight: 600; margin-bottom: 4px;
}
.stat-bar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
.stat-bar-fill { height: 100%; }
.archetype-badge {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.archetype-desc { font-size: 0.78rem; color: var(--dim); font-style: italic; }

#toast {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 8px 16px;
  font-size: 0.85rem;
  z-index: 9;
}

#fatal-error {
  position: fixed;
  inset: 0;
  background: #2a0a0a;
  color: #ffdada;
  z-index: 100;
  padding: 20px;
  font-family: var(--font-mono);
  white-space: pre-wrap;
  overflow: auto;
}

@media (max-width: 480px) {
  #top-bar { font-size: 0.7rem; gap: 6px; padding: 7px 10px; }
  #time-slider { width: 58px; }
}

/* ---------------------------------------------------------------------
   Economy tab charts. Recessive chrome throughout: hairline axes one
   shade off the surface, no gridlines, thin marks. Values and labels wear
   text tokens rather than the series colour - the coloured mark beside
   them carries identity.
--------------------------------------------------------------------- */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px;
}
.chart-card {
  background: var(--panel-strong);
  border-radius: 2px;
  padding: 9px 11px 4px;
}
.chart-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
}
.chart-title {
  font-family: var(--font-body);
  font-size: 0.64rem;
  color: var(--dim);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.chart-now {
  font-family: var(--font-display);
  font-size: 0.98rem;
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.spark { display: block; width: 100%; height: 52px; overflow: visible; }
.spark-axis { stroke: rgba(255, 255, 255, 0.10); stroke-width: 1; }
.chart-empty {
  height: 52px;
  display: flex;
  align-items: center;
  color: var(--dim);
  font-size: 0.72rem;
  font-style: italic;
}

.cargo-chart { display: flex; flex-direction: column; gap: 2px; }
.cargo-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 2px;
  cursor: pointer;
  background: var(--panel-strong);
}
.cargo-row:active, .cargo-row:hover { background: #2a3441; }
.cargo-row.spotlit { outline: 1px solid var(--caution); }
.cargo-chip { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.cargo-name {
  font-family: var(--font-body);
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--ink);
  width: 9.6em;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cargo-track { flex: 1; height: 9px; background: rgba(255, 255, 255, 0.06); border-radius: 2px; overflow: hidden; }
/* Rounded only on the data end, anchored flat to the baseline. */
.cargo-bar { display: block; height: 100%; background: #b8802a; border-radius: 0 4px 4px 0; }
.cargo-val {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
  width: 4.6em;
  text-align: right;
  flex-shrink: 0;
}

/* Daily digest - a end-of-day dispatch summary that slides in at
   midnight. Deliberately corner-anchored rather than modal: it reports,
   it doesn't interrupt, and the sim keeps running behind it. */
#daily-digest {
  position: fixed;
  left: max(10px, env(safe-area-inset-left));
  bottom: calc(45vh + 14px);
  z-index: 7;
  width: min(88vw, 268px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--caution);
  border-radius: 3px;
  padding: 11px 13px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
  cursor: pointer;
  animation: digest-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes digest-in {
  from { opacity: 0; transform: translateX(-14px); }
  to { opacity: 1; transform: none; }
}
#daily-digest .digest-title {
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--caution);
  margin-bottom: 7px;
}
#daily-digest .digest-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.76rem;
  padding: 2px 0;
}
#daily-digest .digest-line span:first-child { color: var(--dim); }
#daily-digest .digest-line span:last-child {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
#daily-digest .digest-star {
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid var(--line);
  font-size: 0.72rem;
  color: var(--dim);
}
#daily-digest .digest-star strong { color: var(--ink); }


/* ---------------------------------------------------------------------
   Load board: shown when the player-controlled truck finishes its layover
   and has to pick its next contract. Deliberately mirrors the junction
   decision overlay's geometry and z-index so the two never fight for the
   same screen space - only one can ever be open, since both pause the sim.
   --------------------------------------------------------------------- */
#contract-overlay {
  position: fixed;
  left: 50%;
  bottom: calc(45vh + 16px);
  transform: translateX(-50%);
  width: min(94vw, 620px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px 12px 12px;
  z-index: 8;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
}
#contract-title {
  font-family: var(--font-display);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--caution);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 10px;
}
#contract-city { color: var(--ink); }
#contract-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 8px;
}
.contract-btn {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
  background: var(--panel-strong);
  border: 1px solid var(--line);
  border-left: 3px solid var(--cargo, var(--line));
  border-radius: 4px;
  padding: 9px 10px 8px;
  color: var(--ink);
  cursor: pointer;
  font-family: var(--font-body);
  text-align: left;
}
.contract-btn:active, .contract-btn:hover { background: #2a3441; border-color: var(--caution); }
.contract-btn .c-cargo {
  font-size: 0.78rem; font-weight: 700; line-height: 1.15;
}
.contract-btn .c-type {
  font-size: 0.6rem; font-family: var(--font-mono); color: var(--cargo, var(--dim));
  text-transform: uppercase; letter-spacing: 0.04em;
}
.contract-btn .c-dest { font-size: 0.7rem; color: var(--ink); }
.contract-btn .c-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 0.64rem; font-family: var(--font-mono); color: var(--dim);
}
.contract-btn .c-pay { color: var(--good); font-weight: 700; font-size: 0.78rem; }
.contract-btn .c-key { font-size: 0.6rem; color: var(--caution); font-family: var(--font-mono); }
#contract-timer { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); margin-top: 12px; overflow: hidden; }
#contract-timer-fill { height: 100%; width: 100%; background: var(--caution); transform-origin: left; }


/* Junction call: the route number plus its signed direction (e.g. "I-25 E"),
   sitting between the shield and the control city. */
.decision-btn .droute {
  font-size: 0.72rem;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--caution);
  letter-spacing: 0.03em;
}
/* The truck's pre-planned next leg. Marked so "stay the course" is
   visually the default rather than just happening to be listed first. */
.decision-btn.planned {
  border-color: var(--go);
  box-shadow: inset 0 0 0 1px rgba(53, 201, 107, 0.25);
}
.decision-btn.planned .dcity { color: var(--go); }

// ==== geo.js ====
// geo.js - graph construction + geography helpers built on top of data.js


const DEFAULT_INTERSTATE_MPH = 70;
const DEFAULT_HIGHWAY_MPH = 55;

// Fixed lat/lon bounds for the continental US, projected into a static
// "world space" once per node so rendering never has to reproject a
// lat/lon on every frame. World units are arbitrary but consistent; the
// camera (see camera.js) maps this space to screen pixels.
// Bounds now extend north to include southern Canada (up to ~Edmonton /
// Saskatoon / Quebec City) while leaving a visual gap to the map's top
// edge. maxLat and WORLD_HEIGHT were grown together so yScale stays
// EXACTLY 96 units/degree (2400/25 == 3120/32.5) -- every pre-existing US
// point simply translates down by (57.0-49.5)*96 = 720 world units, with
// zero distortion. xScale (67.7966 units/deg lon) is untouched. See
// scripts/build-states-data.mjs, which duplicates these bounds and MUST
// be kept in sync, and src/weather.js, which expresses its bands as
// latitudes (via latToWorldY) rather than WORLD_HEIGHT fractions for
// exactly this reason.
const WORLD_BOUNDS = { minLat: 24.5, maxLat: 57.0, minLon: -125.0, maxLon: -66.0 };
const WORLD_WIDTH = 4000;
const WORLD_HEIGHT = 3120; // (57.0 - 24.5) * 96

function projectToWorld(lat, lon) {
    const { minLat, maxLat, minLon, maxLon } = WORLD_BOUNDS;
    return {
        x: (lon - minLon) * (WORLD_WIDTH / (maxLon - minLon)),
        y: (maxLat - lat) * (WORLD_HEIGHT / (maxLat - minLat)),
    };
}

// Exported so other modules (weather.js, main.js) can express positions
// as latitudes instead of duplicating/hardcoding WORLD_HEIGHT fractions.
function latToWorldY(lat) {
    return projectToWorld(lat, WORLD_BOUNDS.minLon).y;
}

function toRad(deg) { return deg * Math.PI / 180; }
function toDeg(rad) { return rad * 180 / Math.PI; }

function haversineMiles(a, b) {
    const R = 3958.8;
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lon - a.lon);
    const la1 = toRad(a.lat), la2 = toRad(b.lat);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

// Initial bearing from a to b, in degrees, 0 = north, clockwise.
function bearing(a, b) {
    const la1 = toRad(a.lat), la2 = toRad(b.lat);
    const dLon = toRad(b.lon - a.lon);
    const y = Math.sin(dLon) * Math.cos(la2);
    const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
    let deg = toDeg(Math.atan2(y, x));
    return (deg + 360) % 360;
}

function compassLabel(deg) {
    const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
    return dirs[Math.round(deg / 45) % 8];
}

const COMPASS_WORD = { N: "North", NE: "Northeast", E: "East", SE: "Southeast", S: "South", SW: "Southwest", W: "West", NW: "Northwest" };

// US highway numbering convention (both the Interstate and the older US
// Numbered Highway systems): ODD route numbers run north-south, EVEN
// numbers run east-west - the reliable rule, not "ends in 0/5" (a
// simplification that happens to hold for many of the big coast-to-coast/
// border-to-border routes, e.g. I-10/I-80/I-90 or I-5/I-75/I-95, but
// isn't the actual convention - I-4, I-16, I-66 are all even/east-west
// despite not ending in 0, and I-19/I-99 are odd/north-south despite not
// ending in 5). Only reliable for 1-2 digit route numbers - a 3-digit
// route (a spur or beltway loop off a parent route, e.g. I-380, I-215)
// doesn't dependably inherit its parent's axis (I-380 is even/"should"
// be east-west by the numeric rule but is actually a north-south spur),
// so those fall back to the edge's own measured compass label instead of
// a forced axis.
function routeAxis(route) {
    const m = route.match(/^(?:I|US)-(\d+)/);
    if (!m) return null;
    const num = parseInt(m[1], 10);
    if (num >= 100) return null;
    return num % 2 === 0 ? "EW" : "NS";
}

// The direction word for a truck's current edge, honoring the route's
// fixed axis where one reliably applies (see routeAxis) rather than the
// edge's literal bearing - a north-south interstate reads as "North" or
// "South" the whole way even through a jog that briefly angles east or
// west. Falls back to the edge's own 8-way compass label when no fixed
// axis applies (3-digit routes, or an unrecognized route prefix).
function travelDirectionLabel(edge) {
    const axis = routeAxis(edge.route);
    const rad = (edge.bearing * Math.PI) / 180;
    if (axis === "NS") return Math.cos(rad) >= 0 ? "North" : "South";
    if (axis === "EW") return Math.sin(rad) >= 0 ? "East" : "West";
    return COMPASS_WORD[edge.dirLabel] || edge.dirLabel;
}

// Small deterministic string hash -> 32-bit int, used to seed per-entity
// PRNGs (driver personality, contract rolls) so the same seed always
// reproduces the same result.
function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return h >>> 0;
}

function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function terrainSpeed(cityA, cityB, fallback) {
    const k1 = `${cityA}-${cityB}`;
    const k2 = `${cityB}-${cityA}`;
    if (terrainModifiers.hasOwnProperty(k1)) return terrainModifiers[k1];
    if (terrainModifiers.hasOwnProperty(k2)) return terrainModifiers[k2];
    return fallback;
}

// Walk forward along a route's city list from `index` in `dir` (+1/-1)
// looking for the nearest "major" city (tier <= 2) to use as a highway
// sign control city. Falls back to the terminus of the route.
function findControlCity(cityList, index, dir) {
    let i = index + dir;
    let last = null;
    while (i >= 0 && i < cityList.length) {
        const name = cityList[i];
        const c = masterCities[name];
        if (c && c.t <= 2) return name;
        last = name;
        i += dir;
    }
    return last;
}

// Stable identity string for a directed edge (from/to/route uniquely
// identify one direction of travel on a route segment).
function edgeId(edge) {
    return edge.from + "|" + edge.to + "|" + edge.route;
}

function buildGraph() {
    const nodes = {};
    for (const name in masterCities) {
        const data = masterCities[name];
        const { x, y } = projectToWorld(data.lat, data.lon);
        nodes[name] = Object.assign({ name, x, y }, data);
    }

    // adjacency[city] = array of edge objects
    const adjacency = {};
    for (const name in nodes) adjacency[name] = [];

    function ingestRouteTable(table, kind, defaultMph) {
        for (const routeName in table) {
            const cities = table[routeName];
            for (let i = 0; i < cities.length - 1; i++) {
                const a = cities[i], b = cities[i + 1];
                if (!nodes[a] || !nodes[b]) continue; // guard against typos in source data
                const mph = terrainSpeed(a, b, defaultMph);
                const miles = haversineMiles(nodes[a], nodes[b]);
                const brgAB = bearing(nodes[a], nodes[b]);
                const brgBA = (brgAB + 180) % 360;

                // A crossing is derived, never hand-marked: whenever the two
                // endpoint nodes' country fields differ (missing = "US" - see
                // buildGraph, which spreads masterCities' raw fields, including
                // "country", onto every node). borderType comes from whichever
                // side declares one explicitly (see data.js/POE tagging below);
                // this stays undefined until Phase C data adds it, so every
                // crossing defaults to "rural" until tagged otherwise.
                const countryA = nodes[a].country || "US", countryB = nodes[b].country || "US";
                const isBorder = countryA !== countryB;
                const borderType = isBorder ? (nodes[a].poe || nodes[b].poe || "rural") : undefined;
                const borderName = isBorder ? `${a}/${b}` : undefined;

                adjacency[a].push({
                    from: a, to: b, route: routeName, kind, speedLimit: mph, miles,
                    bearing: brgAB, dirLabel: compassLabel(brgAB),
                    control: findControlCity(cities, i, +1),
                    isBorder, borderType, borderName,
                });
                adjacency[b].push({
                    from: b, to: a, route: routeName, kind, speedLimit: mph, miles,
                    bearing: brgBA, dirLabel: compassLabel(brgBA),
                    control: findControlCity(cities, i + 1, -1),
                    isBorder, borderType, borderName,
                });
            }
        }
    }

    ingestRouteTable(interstateRoutes, "interstate", DEFAULT_INTERSTATE_MPH);
    ingestRouteTable(highwayRoutes, "highway", DEFAULT_HIGHWAY_MPH);

    return { nodes, adjacency };
}

// All legal next edges from `node`, excluding a straight U-turn back the
// way `excludeReverseOf` came from (unless that's the only option, e.g. a
// dead end).
function pickEdgesFrom(graph, node, excludeReverseOf) {
    const all = graph.adjacency[node] || [];
    const filtered = all.filter((e) => !(excludeReverseOf && e.to === excludeReverseOf.from && e.route === excludeReverseOf.route));
    return filtered.length ? filtered : all;
}

// ---------------------------------------------------------------------
// A* pathfinding: a binary min-heap open set (O(log n) push/pop instead
// of an O(n) sorted-array insert) plus a small bounded path cache, since
// many trucks will request routes. Cost = real miles; heuristic =
// straight-line miles to the goal, which is always <= the true remaining
// road distance, so it's admissible.
// ---------------------------------------------------------------------
class MinHeap {
    constructor(scoreOf) {
        this.scoreOf = scoreOf;
        this.data = [];
    }
    size() { return this.data.length; }
    push(item) {
        this.data.push(item);
        this._bubbleUp(this.data.length - 1);
    }
    pop() {
        const top = this.data[0];
        const last = this.data.pop();
        if (this.data.length > 0) {
            this.data[0] = last;
            this._sinkDown(0);
        }
        return top;
    }
    _bubbleUp(i) {
        while (i > 0) {
            const parent = (i - 1) >> 1;
            if (this.scoreOf(this.data[i]) < this.scoreOf(this.data[parent])) {
                [this.data[i], this.data[parent]] = [this.data[parent], this.data[i]];
                i = parent;
            } else break;
        }
    }
    _sinkDown(i) {
        const n = this.data.length;
        while (true) {
            const l = 2 * i + 1, r = 2 * i + 2;
            let smallest = i;
            if (l < n && this.scoreOf(this.data[l]) < this.scoreOf(this.data[smallest])) smallest = l;
            if (r < n && this.scoreOf(this.data[r]) < this.scoreOf(this.data[smallest])) smallest = r;
            if (smallest === i) break;
            [this.data[i], this.data[smallest]] = [this.data[smallest], this.data[i]];
            i = smallest;
        }
    }
}

const PATH_CACHE_MAX = 5000;
const pathCache = new Map();

function cachePath(key, value) {
    if (pathCache.size >= PATH_CACHE_MAX) {
        pathCache.delete(pathCache.keys().next().value); // evict oldest (Map preserves insertion order)
    }
    pathCache.set(key, value);
}

// Static per-mile penalties added to a border edge's cost so routing
// funnels traffic onto the high-throughput urban crossings the way real
// freight does, rather than treating a rural one-truck-per-hour crossing
// as equally attractive. MUST stay static (a function of the edge alone,
// never of live queue length) - findPath's result is cached by
// startName->goalName->routeClass, and a queue-dependent cost would
// silently poison that cache with a route that was only cheap the moment
// it was computed.
const BORDER_PENALTY_URBAN = 60;
const BORDER_PENALTY_RURAL = 400;

// Route "classes" fix the A* cache's biggest remaining shortcut: every
// driver used to get the literal same cheapest-miles path between any two
// cities, so no driver trait ever showed up in navigation. Each class is a
// distinct, but still fully static, cost function - class stays fixed per
// driver for the life of the cache entry, so the LRU still partitions
// cleanly (worst case: entries per city-pair triple instead of one).
// class 0: pure miles (the original behaviour - default for any caller
//   that doesn't pass a driver, e.g. tests).
// class 1: mildly prefers interstates - assigned to higher-compliance
//   drivers, who stick to the "proper" route rather than cutting through
//   backroads.
// class 2: mildly prefers highways over interstates - assigned to
//   aggressive/high-hustle drivers, who cut corners and avoid interstate
//   congestion even at a small distance cost.
function routeClassOf(driver) {
    if (!driver) return 0;
    if (driver.aggression > 0.6 || driver.hustle > 0.7) return 2;
    if (driver.compliance > 0.6) return 1;
    return 0;
}

function edgeCost(e, routeClass) {
    let mult = 1;
    if (routeClass === 1 && e.kind === "interstate") mult = 0.92;
    else if (routeClass === 1 && e.kind !== "interstate") mult = 1.08;
    else if (routeClass === 2 && e.kind === "highway") mult = 0.92;
    else if (routeClass === 2 && e.kind === "interstate") mult = 1.05;
    let cost = e.miles * mult;
    if (e.isBorder) cost += e.borderType === "urban" ? BORDER_PENALTY_URBAN : BORDER_PENALTY_RURAL;
    return cost;
}

// Returns an array of directed edges from startName to goalName (the
// route to walk edge-by-edge), or null if unreachable. `routeClass`
// (see routeClassOf above) is 0 unless the caller passes a driver's class
// through explicitly.
function findPath(graph, startName, goalName, routeClass = 0) {
    if (startName === goalName) return null;
    const cacheKey = `${startName}->${goalName}|${routeClass}`;
    if (pathCache.has(cacheKey)) return pathCache.get(cacheKey);

    const goalNode = graph.nodes[goalName];
    if (!graph.nodes[startName] || !goalNode) return null;

    const gScore = new Map([[startName, 0]]);
    const fScore = new Map([[startName, haversineMiles(graph.nodes[startName], goalNode)]]);
    const cameFromEdge = new Map();
    const closed = new Set();

    const heap = new MinHeap((name) => fScore.get(name) ?? Infinity);
    heap.push(startName);

    while (heap.size() > 0) {
        const current = heap.pop();
        if (closed.has(current)) continue;
        if (current === goalName) {
            const path = [];
            let cur = current;
            while (cameFromEdge.has(cur)) {
                const e = cameFromEdge.get(cur);
                path.unshift(e);
                cur = e.from;
            }
            cachePath(cacheKey, path);
            return path;
        }
        closed.add(current);

        for (const e of graph.adjacency[current] || []) {
            if (closed.has(e.to)) continue;
            const tentativeG = (gScore.get(current) ?? Infinity) + edgeCost(e, routeClass);
            if (tentativeG < (gScore.get(e.to) ?? Infinity)) {
                cameFromEdge.set(e.to, e);
                gScore.set(e.to, tentativeG);
                fScore.set(e.to, tentativeG + haversineMiles(graph.nodes[e.to], goalNode));
                heap.push(e.to);
            }
        }
    }

    cachePath(cacheKey, null);
    return null;
}

// ---------------------------------------------------------------------
// World time-of-day. Lives here rather than in render.js because it's
// pure geography/time math with no drawing in it, and BOTH the simulation
// (fleet.js's rush-hour slowdown) and the renderer (the day/night colour
// grade, city lights, headlights) need it - the sim importing the
// renderer just to ask what time it is would be backwards.
//
// World x=0 is lon -125 (west), x=WORLD_WIDTH is lon -66 (east): a 59deg
// span, ~3.93 hours of solar time. TERMINATOR_SWEEP_MIN sweeps local time
// across that span (the west is always earlier), so sunset visibly
// crosses the country instead of the whole map flipping at once.
// ---------------------------------------------------------------------
// A full west-to-east sweep of the map takes TERMINATOR_SWEEP_MIN. New
// York and Los Angeles sit 74.98% of the map width apart, so 240 minutes
// end to end puts exactly 180 - three game-hours - between sunset in NYC
// and sunset in LA, which is the intended pacing.
const TERMINATOR_SWEEP_MIN = 240;

// The sim clock is East Coast time, so the terminator is anchored on NEW
// YORK rather than on the map's eastern edge. That edge is lon -66, out
// past Maine; anchoring there made NYC reach its own local dusk about 33
// minutes after the HUD clock read 7pm. With this offset, local time at
// NYC is exactly the game clock, so dusk lands at 19:00 and dawn at 07:00
// on the nose, and LA follows three hours later.
const ANCHOR_LON = -74.006; // New York City
const ANCHOR_PCT_WEST = 1 - (ANCHOR_LON - WORLD_BOUNDS.minLon) / (WORLD_BOUNDS.maxLon - WORLD_BOUNDS.minLon);

const DAWN_MIN = 7 * 60;   // 07:00 in NYC - full daylight from here
const DUSK_MIN = 19 * 60;  // 19:00 in NYC - darkness starts accumulating
const NIGHT_LEN = 1440 - (DUSK_MIN - DAWN_MIN); // 720
const NIGHT_DARKNESS_MAX = 0.65;

// Mean of rawDarknessAtX over a full 24h cycle: 0 for the 720-minute
// daylight window, and a half-sine (mean 2/PI of its peak) for the
// NIGHT_LEN minutes either side of it.
const AVG_DARKNESS = NIGHT_DARKNESS_MAX * (2 / Math.PI) * (NIGHT_LEN / 1440);

// Minute-of-day [0, 1440) at a given world X - i.e. the LOCAL clock at
// that longitude, which is what "is it rush hour here" and "how dark is
// it here" both actually depend on.
function localMinutesAtX(worldX, gameSeconds) {
    const pctWest = 1 - worldX / WORLD_WIDTH;
    // Offset relative to the NYC anchor, so local time AT NYC is exactly
    // the game clock and everywhere west of it runs correspondingly behind.
    let m = (gameSeconds / 60 - (pctWest - ANCHOR_PCT_WEST) * TERMINATOR_SWEEP_MIN) % 1440;
    if (m < 0) m += 1440;
    return m;
}

// Local darkness [0, NIGHT_DARKNESS_MAX] straight off the HUD clock,
// before any time-scale damping.
function rawDarknessAtX(worldX, gameSeconds) {
    const m = localMinutesAtX(worldX, gameSeconds);
    if (m >= DAWN_MIN && m < DUSK_MIN) return 0;
    const p = m >= DUSK_MIN ? m - DUSK_MIN : m + 1440 - DUSK_MIN;
    return Math.sin((p / NIGHT_LEN) * Math.PI) * NIGHT_DARKNESS_MAX;
}

// At 1x a full game day passes in 36 real seconds (BASE_TIME_SCALE=2400
// game-seconds per real second); at the slider's 8x cap, 4.5 seconds -
// undamped, the sky would strobe between noon and midnight several times
// a minute. This blends toward the day's mean as timeScale climbs, so 1x
// still shows a full cycle while high speeds settle into a steady dusk.
// Identity at timeScale <= 1, so the common case is untouched.
function effectiveDarkness(raw, timeScale) {
    const blend = 1 / (1 + Math.max(0, timeScale - 1) * 0.6);
    return raw * blend + AVG_DARKNESS * (1 - blend);
}


// ==== driver.js ====
// driver.js - lightweight per-truck personality flavor. No reaction-time
// or merge-confidence fields here - just a few stats that read well in
// the fleet dashboard and give trucks some character (a "fastest truck"
// or "top earner" leaderboard is more fun when the leader has a name and
// a vibe), plus the accel/decel rates fleet.js's car-following/passing
// logic uses to make aggressive drivers visibly surge and brake harder.
"use strict";

class DriverDNA {
    constructor(rnd = Math.random) {
        this.aggression = rnd();
        this.hustle = rnd();
        this.skill = rnd();
        this.compliance = rnd();

        // cruiseMult: how far above/below the posted speed limit this
        // driver tends to run — aggressive+skilled drivers push it,
        // highly compliant drivers sit at or under it.
        this.cruiseMult = 0.92 + this.aggression * 0.28 - (this.compliance > 0.8 ? 0.08 : 0);
        // fuelBurnMult: skilled/smooth drivers sip less, aggressive ones burn more.
        this.fuelBurnMult = 1.18 - this.skill * 0.3 + this.aggression * 0.1;

        // accelRate/decelRate: how fast this driver's speed eases toward
        // a target (replaces a flat easing constant) - higher is
        // snappier. Braking is always faster than accelerating for
        // everyone, but aggressive drivers push both harder.
        this.accelRate = 2.2 + this.aggression * 1.6;
        this.decelRate = 2.8 + this.aggression * 2.4;

        // fastCard: holds a NEXUS/FAST trusted-traveler card, cutting
        // border-crossing customs time (see fleet.js's customs FSM).
        // Skewed toward skilled drivers (frequent, careful cross-border
        // hauls are what earns one), not a flat coin flip.
        this.fastCard = rnd() < 0.15 + this.skill * 0.2;
    }

    getArchetype() {
        if (this.aggression > 0.7 && this.compliance < 0.3) return { label: "OUTLAW", color: "#e5484d", desc: "Fast and loose." };
        if (this.skill > 0.75 && this.compliance > 0.55 && this.aggression < 0.5) return { label: "VETERAN", color: "#4d9fff", desc: "Smooth and efficient." };
        if (this.hustle > 0.7 && this.aggression < 0.6) return { label: "WORKHORSE", color: "#35c96b", desc: "Always moving." };
        if (this.skill < 0.35) return { label: "ROOKIE", color: "#ffb020", desc: "Still learning the ropes." };
        return { label: "COMPANY DRIVER", color: "#9aa4b2", desc: "Standard operator." };
    }
}

// ==== economy.js ====
// economy.js - contract generation: what a truck hauls, to where, and for
// how much. No persistent per-city market and no inventory: a contract is
// generated on demand when a truck is free, driven, paid out, done. The
// "supply chain" is deliberately two links long - a city produces, a city
// receives - which is all the simulation needs to feel alive.
//
// WHAT a city ships comes from products.js (85 named products, 252 city
// export profiles), not from the industry tags directly. The tags in
// data.js seeded that file but are no longer consulted at runtime for
// cargo, because only 10 of ~180 distinct tags were ever wired up, which
// left 60% of cities generating nothing but generic dry freight.
//
// The one exception where tags ARE still read is MILITARY_CITIES below,
// which powers the destination bias for military loads.




const TRUCK_TYPES = {
    DRYVAN: { id: "DRYVAN", label: "Dry Van", color: "#e8ecef", multiplier: 1.0 },
    REEFER: { id: "REEFER", label: "Reefer", color: "#35c96b", multiplier: 1.18 },
    TANKER: { id: "TANKER", label: "Tanker", color: "#e0473c", multiplier: 1.3 },
    FLATBED: { id: "FLATBED", label: "Flatbed", color: "#d97706", multiplier: 1.22 },
    AUTO: { id: "AUTO", label: "Auto Hauler", color: "#3b82f6", multiplier: 1.2 },
    TECH: { id: "TECH", label: "High-Value Van", color: "#d946ef", multiplier: 1.3 },
    MILITARY: { id: "MILITARY", label: "Military", color: "#9ca3af", multiplier: 1.6 },
};

const GENERAL_CARGO_POOL = [
    "General Freight", "Retail Goods", "Amazon Parcels", "Warehouse Pallets",
    "Packaged Consumer Goods", "Furniture", "Building Supplies", "Paper Products",
    "Household Appliances", "Office Supplies", "Clothing & Textiles", "Hardware",
];

function weightedPick(list, weightFn, rnd) {
    const total = list.reduce((s, x) => s + weightFn(x), 0);
    let r = rnd() * total;
    for (const item of list) {
        r -= weightFn(item);
        if (r <= 0) return item;
    }
    return list[list.length - 1];
}

// Cities that plausibly send/receive military freight, derived once from
// the industry tags in data.js rather than hand-listed, so it can't drift
// out of sync with the city data. Used for the destination bias below -
// military cargo is the one category that should NOT just go anywhere.
const MILITARY_TAGS = ["Military", "Defense", "AFB", "Naval", "Navy", "Arsenal", "Armor", "Missiles"];
const MILITARY_CITIES = new Set();
for (const name in masterCities) {
    const tags = masterCities[name].ind || [];
    if (tags.some((t) => MILITARY_TAGS.includes(t))) MILITARY_CITIES.add(name);
}

function generalCargo(rnd) {
    return {
        cargo: GENERAL_CARGO_POOL[Math.floor(rnd() * GENERAL_CARGO_POOL.length)],
        truckType: TRUCK_TYPES.DRYVAN,
        category: "General Freight",
    };
}

// What this city ships. Driven entirely by products.js; a city with no
// export profile (small towns with no distinctive industry) falls back to
// ordinary dry freight, same as before.
function pickCargo(cityName, rnd) {
    const profile = CITY_EXPORTS[cityName];
    if (!profile || !profile.length) return generalCargo(rnd);
    const pick = weightedPick(profile, (e) => e[1], rnd);
    if (!pick || pick[0] === "GENERAL") return generalCargo(rnd);
    const def = PRODUCTS[pick[0]];
    if (!def) return generalCargo(rnd); // defensive: products.js is validated at build time
    return { cargo: pick[0], truckType: TRUCK_TYPES[def.truck], category: def.category };
}

// Gravity-weighted destination pick: bigger/closer cities are more likely,
// with a trip-length dice roll (short/medium/long) so the fleet doesn't
// only ever run short hops or only ever run cross-country ones.
//
// `preferSet` (optional): a Set of city names whose score is multiplied by
// PREFER_MULT. Used only for military freight, which should move between
// installations rather than to whichever metro happens to be biggest.
// Deliberately a weighting rather than a hard filter - a hard filter would
// make every military load run the same handful of city pairs.
const PREFER_MULT = 14;

// Cross-border freight is real but a minority: most Canadian freight
// should stay domestic, and most US freight should stay in the US. This
// multiplies the score of any candidate whose country differs from the
// origin's - calibrated (see scratchpad/canada/cross_border_calib.mjs)
// against a ~30% cross-border share target for cities within reach of a
// border crossing, not a literal 30% of ALL contracts (most cities, on
// both sides, are nowhere near the border and would essentially never
// cross regardless of this constant).
// Calibrated (scratchpad/canada/calib_sweep.mjs, 8000-contract sweep) so
// contracts originating in Canada cross the border ~29% of the time -
// this needed a much stronger penalty than the naive "roughly 1/4" guess:
// Canada has only 42 cities vs 376 in the US, so even a 4x handicap on
// cross-border score left US destinations dominating the weighted pool.
const CROSS_BORDER_MULT = 0.06;

function pickDestination(graph, originName, rnd, preferSet = null) {
    const origin = graph.nodes[originName];
    const tripRoll = rnd();
    const candidates = [];
    let totalWeight = 0;

    for (const name in graph.nodes) {
        if (name === originName) continue;
        const node = graph.nodes[name];
        if (node.t === 0) continue; // pure junction filler nodes aren't real destinations
        if (!graph.adjacency[name] || !graph.adjacency[name].length) continue; // a handful of data-entry cities never got wired into any route
        const miles = haversineMiles(origin, node);

        if (tripRoll < 0.4 && miles >= 500) continue;
        if (tripRoll >= 0.4 && tripRoll < 0.75 && (miles < 300 || miles > 1400)) continue;
        if (tripRoll >= 0.75 && miles <= 1400) continue;

        let gravity = node.w;
        if (node.w < 4) gravity *= 1.15; // give small towns a fighting chance, without letting them regularly out-score a hub
        const distanceFriction = 1 / Math.sqrt(1 + miles / 800);
        let score = gravity * distanceFriction * (0.85 + rnd() * 0.3);
        if (preferSet && preferSet.has(name)) score *= PREFER_MULT;
        if ((origin.country || "US") !== (node.country || "US")) score *= CROSS_BORDER_MULT;
        if (score > 0.0001) {
            candidates.push({ name, score });
            totalWeight += score;
        }
    }

    if (!candidates.length) {
        const names = Object.keys(graph.nodes).filter((n) => n !== originName && graph.nodes[n].t > 0);
        return names[Math.floor(rnd() * names.length)];
    }
    let roll = rnd() * totalWeight;
    for (const c of candidates) {
        roll -= c.score;
        if (roll <= 0) return c.name;
    }
    return candidates[candidates.length - 1].name;
}

const PAY_RATE_PER_MILE = 2.35;
const TIER_PAY_MULT = { 1: 1.35, 2: 1.15, 3: 1.0, 4: 0.85 };

// Generates one full contract for a truck sitting at `originName`: cargo
// first (it's a property of where the truck IS, not where it's going),
// then a destination, its A* route, and a payout fixed now (based on
// optimal distance) so a detour later costs the driver real fuel/time
// without changing what the job pays.
function generateContract(graph, originName, rnd = Math.random, driver = null) {
    const { cargo, truckType, category } = pickCargo(originName, rnd);
    // Military loads route between installations; everything else uses the
    // plain gravity/distance picker.
    const prefer = truckType.id === "MILITARY" ? MILITARY_CITIES : null;
    const destination = pickDestination(graph, originName, rnd, prefer);
    // Threading the driver's route class through here (rather than always
    // using the plain-miles default) is what makes a driver's own traits
    // finally show up in navigation - see routeClassOf/edgeCost in geo.js.
    const path = findPath(graph, originName, destination, routeClassOf(driver));
    const optimalMiles = path ? path.reduce((s, e) => s + e.miles, 0) : haversineMiles(graph.nodes[originName], graph.nodes[destination]);
    const tierMult = TIER_PAY_MULT[graph.nodes[destination].t] ?? 1;
    const payout = Math.round(optimalMiles * PAY_RATE_PER_MILE * truckType.multiplier * tierMult);
    return { origin: originName, destination, cargo, category, truckType, optimalMiles, payout, path };
}

// A small board of distinct offers for a truck sitting at `originName`.
// Deliberately generated fresh per stop rather than kept as a persistent
// per-city market: contracts are cheap to make, and a standing board would
// need invalidation logic for something no one can observe.
//
// Offers are de-duplicated by destination so the player is never asked to
// choose between three loads to the same city, and any contract whose A*
// route came back empty is discarded rather than offered.
function generateContractOffers(graph, originName, count = 3, rnd = Math.random, driver = null) {
    const offers = [];
    const seenDest = new Set();
    for (let attempt = 0; attempt < count * 6 && offers.length < count; attempt++) {
        const c = generateContract(graph, originName, rnd, driver);
        if (!c.path || !c.path.length) continue;
        if (seenDest.has(c.destination)) continue;
        seenDest.add(c.destination);
        offers.push(c);
    }
    return offers;
}

// Which offer an AI driver takes. This is where driver personality finally
// reaches a decision that matters: a hustler chases rate-per-mile, an
// aggressive driver reaches for the long haul, a cautious one takes the
// short local run. The random term keeps two identical drivers at the same
// city from always making identical choices.
function chooseOffer(offers, driver, rnd = Math.random) {
    if (!offers.length) return null;
    let best = offers[0], bestScore = -Infinity;
    for (const o of offers) {
        const ratePerMile = o.payout / Math.max(1, o.optimalMiles);
        const lengthPref = (o.optimalMiles / 1500) * (driver.aggression - 0.45);
        const score = ratePerMile * (0.55 + driver.hustle * 0.9)
            + lengthPref * 1.1
            + rnd() * 0.18;
        if (score > bestScore) { bestScore = score; best = o; }
    }
    return best;
}


// ==== weather.js ====
// weather.js - drifting regional weather systems. Deliberately a tiny,
// self-contained model: a handful of soft circular cells that move west
// to east (the way real North American systems track) and slow any truck
// caught inside them. It lives in its own module because BOTH the
// simulation (fleet.js reads the speed multiplier) and the renderer
// (render.js draws the cells) need it, and neither should own it.
//
// The whole point is regional variety: a run through a snowstorm across
// the northern plains should visibly take longer than the same run in
// clear weather, and you should be able to SEE why on the map.
"use strict";



// Snow above this world Y, rain below it. y = (maxLat - lat) * scale, so
// SMALL y is NORTH. Expressed as a latitude (not a WORLD_HEIGHT fraction)
// so the Canada map-expansion (geo.js) can't silently drag the snow line
// north with it - 39.0N is unchanged from when this was WORLD_HEIGHT*0.42.
const SNOW_LINE_Y = latToWorldY(39.0);

// Speed multipliers at the dead centre of a cell at full intensity;
// scaled down toward 1.0 at the cell's edge, so trucks ease into and out
// of a system rather than hitting a wall.
const RAIN_WORST = 0.86;
const SNOW_WORST = 0.68;

// Systems track eastward. World units per game-hour - tuned so a cell
// crosses the country in roughly two and a half game-days, which is slow
// enough to feel like weather rather than strobing.
const DRIFT_X_PER_HOUR = 26;

function createWeather(count = 7, rnd = Math.random) {
  const cells = [];
  for (let i = 0; i < count; i++) cells.push(spawnCell(rnd, rnd() * WORLD_WIDTH));
  return cells;
}

// US-only band, 46.5N (upper Great Lakes/New England) down to 27.5N (deep
// south Texas/Florida) - expressed as latitudes for the same reason as
// SNOW_LINE_Y above. Weather does not extend over Canada in this pass.
const SPAWN_LAT_NORTH = 46.5, SPAWN_LAT_SOUTH = 27.5;
const SPAWN_Y_NORTH = latToWorldY(SPAWN_LAT_NORTH), SPAWN_Y_SOUTH = latToWorldY(SPAWN_LAT_SOUTH);
// Vertical wander walls, slightly outside the spawn band (47.5N / 26.5N).
const BOUNCE_Y_NORTH = latToWorldY(47.5), BOUNCE_Y_SOUTH = latToWorldY(26.5);

function spawnCell(rnd, x) {
  const y = SPAWN_Y_NORTH + rnd() * (SPAWN_Y_SOUTH - SPAWN_Y_NORTH);
  return {
    x,
    y,
    r: 190 + rnd() * 340,
    kind: y < SNOW_LINE_Y && rnd() < 0.62 ? "snow" : "rain",
    intensity: 0.45 + rnd() * 0.55,
    // A little vertical wander so systems don't march in a straight line.
    vy: (rnd() - 0.5) * 5,
    seed: rnd() * 1000,
  };
}

// Advances every cell by `gameHours`. Cells that drift off the eastern
// edge respawn on the western side as a fresh system, so the map always
// has weather somewhere without the array ever growing.
function updateWeather(cells, gameHours, rnd = Math.random) {
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    c.x += DRIFT_X_PER_HOUR * gameHours;
    c.y += c.vy * gameHours;
    if (c.y < BOUNCE_Y_NORTH || c.y > BOUNCE_Y_SOUTH) c.vy = -c.vy;
    if (c.x - c.r > WORLD_WIDTH) cells[i] = spawnCell(rnd, -c.r);
  }
}

// Combined speed multiplier for a point, in [worst, 1]. Overlapping
// systems compound (taking the product), so a truck in the middle of two
// stacked cells really is having a bad day.
function weatherSpeedMultAt(cells, x, y) {
  let mult = 1;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    const dx = x - c.x, dy = y - c.y;
    const d2 = dx * dx + dy * dy;
    if (d2 >= c.r * c.r) continue;
    // Linear falloff from centre to rim.
    const strength = (1 - Math.sqrt(d2) / c.r) * c.intensity;
    const worst = c.kind === "snow" ? SNOW_WORST : RAIN_WORST;
    mult *= 1 - (1 - worst) * strength;
  }
  return mult;
}


// ==== render.js ====
// render.js - static background (bg fill + state borders, drawn once to an
// offscreen canvas) plus a per-frame dynamic layer: roads, city dots, a
// day/night terminator + city-light glow, city labels, truck dots,
// selection ring, and the followed-truck route highlight. Roads and city
// dots used to be baked into the static bitmap, but day/night needs to
// recolor them every frame and the old 1.5x-scaled bitmap was already
// visibly soft at FOLLOW_ZOOM - both now render fresh each frame from a
// flat edge list built once at boot. Labels also stay dynamic: which
// tiers are visible depends on the live camera zoom, drawn fresh each
// frame against camera.baseZoom (the initial fit-to-screen zoom set by
// main.js).





// Supersample the static layer a bit so zooming in isn't too soft. Lowered
// from 1.5 to 1.1 when the Canada expansion grew WORLD_HEIGHT: the bake
// now carries only the void fill, land fill and state/province border
// strokes (roads/medians/city dots moved to a per-frame pass earlier), so
// the loss of supersampling is minor, and this keeps the canvas under
// mobile Safari's ~16.8 Mpx historical canvas-area ceiling (6000x3432 =
// 20.6M px was too close at 1.5 with the taller world; 1.1 -> 4400x3432 =
// 15.1M px). WORLD_HEIGHT must stay a multiple of 10 for both this and
// GLOW_SCALE below to land on whole device pixels (see geo.js).
const BG_SCALE = 1.1;
// The basemap is baked at its NOON appearance: land is a legible slate
// blue and the surrounding void is near-black. Everything darker or
// warmer than this is produced by the per-frame sky grade tinting away
// from it (see SKY_KEYFRAMES), which is what gives the day/night cycle
// somewhere to travel - a uniformly near-black map, as this used to be,
// has no dynamic range for "night" to mean anything.
const VOID_COLOR = "#05080f";
const LAND_COLOR = "#2b3648";
const STATE_BORDER_COLOR = "rgba(168, 186, 214, 0.55)"; // a soft edge ON the land, not a bright line on a void
const STATE_BORDER_WIDTH = 1.6;
// City dots, tier 1..4. A single gold ramp that darkens with tier: bright
// golden yellow for the major hubs down to a dark orange-brown for small
// towns, so importance reads from colour as well as size. Deliberately warm
// against the cool blue-grey road/land palette, which is what makes them
// pop out at country zoom where they were previously getting lost.
const CITY_DOT_COLOR = ["#ffd24a", "#e0a52c", "#bd7d1e", "#8f5c18"];
const TRUCK_DOT_RADIUS = 3.5; // exported: fleet.js's car-following/passing gaps are sized off this

// Two-lanes-per-direction offsets, interstate-only (highways stay
// single-file). World units, in the same camera-scaled space as
// everything else, so they scale naturally with zoom. LEFT is the
// passing lane, close against the median; RIGHT is the default lane.
// Deliberately closer together than "2 * radius" (the two lanes are
// allowed a slight overlap when a truck is directly beside another in
// the next lane over - reads as normal lane-adjacent traffic rather
// than an exaggerated gap) - fleet.js's overlap guard is aware of this
// and only relaxes its own check by the same amount, see
// CROSS_LANE_TARGET_WORLD_UNITS there.
const LEFT_LANE_OFFSET = TRUCK_DOT_RADIUS + 1; // exported: fleet.js's overlap clamp needs the exact rendered offset
const RIGHT_LANE_OFFSET = LEFT_LANE_OFFSET + 2 * TRUCK_DOT_RADIUS - 2;

// US highways are single-lane each way, but opposing traffic still needs to
// look like it has its own side of the road rather than sharing one
// centerline. Chosen against the highway's real dimensions rather than by
// eye: the dot is 3.5 across the radius, the fog line sits at 5.0 and the
// asphalt ends at 8.0 (HWY_FOG / HWY_BAND_HALF below), so at 4.5 the two
// directions clear each other by 2.0 units while the outer edge of a dot
// lands exactly on the asphalt edge. That is the most separation available
// without putting trucks off the pavement - it does overlap the shoulder
// strip, which is the better of the two compromises.
const HIGHWAY_LANE_OFFSET = 4.5;

// ---------------------------------------------------------------------
// Road geometry - every offset below is arithmetic on the lane constants
// above, never a bare number, so the drawn pavement can never drift out
// of sync with where trucks actually paint. A truck riding the right
// (default) lane sits at RIGHT_LANE_OFFSET (9.5) with its dot extending
// to RIGHT_LANE_OFFSET + TRUCK_DOT_RADIUS = 13.0 world units from the
// centerline - FOG_OFFSET below is exactly that value, so the truck's
// outer edge is tangent to the fog/edge line by construction.
// ---------------------------------------------------------------------
const MEDIAN_GAP = LEFT_LANE_OFFSET - TRUCK_DOT_RADIUS; // 1.0 - centerline -> inner edge of the passing lane
const FOG_OFFSET = RIGHT_LANE_OFFSET + TRUCK_DOT_RADIUS; // 13.0 - outer edge of the travel lane == white edge line
const SHOULDER_W = 4.0; // paved shoulder beyond the fog line
const BAND_HALF = FOG_OFFSET + SHOULDER_W; // 17.0 - half-width of the full asphalt band
// Highways: truckWorldPos applies no lane offset for kind !== "interstate"
// (single-file, centerline), so their band is derived narrower/simpler.
const HWY_FOG = TRUCK_DOT_RADIUS + 1.5; // 5.0
const HWY_BAND_HALF = HWY_FOG + 3.0; // 8.0

// Rural border-crossing queue: parked trucks stack on the SHOULDER, past
// the fog line, while through traffic continues in the normal travel
// lane. laneOffset()/truckWorldPos's RIGHT_LANE_OFFSET can't express an
// outward offset (it only interpolates between LEFT_LANE_OFFSET and
// RIGHT_LANE_OFFSET), so this is its own constant, derived the same way
// the rest of the ladder is: RIGHT_LANE_OFFSET + SHOULDER_W puts a dot's
// OUTER edge (+TRUCK_DOT_RADIUS) at exactly BAND_HALF - flush inside the
// pavement by construction, never hanging off the asphalt.
const SHOULDER_LANE_OFFSET = RIGHT_LANE_OFFSET + SHOULDER_W; // 13.5
// Spacing between consecutive queued trucks, in world units - matches the
// same "just past touching" feel as fleet.js's MIN_DOT_GAP_WORLD_UNITS
// (2*TRUCK_DOT_RADIUS+1) rather than duplicating that private constant.
const SHOULDER_QUEUE_GAP_WORLD_UNITS = 2 * TRUCK_DOT_RADIUS + 1;

const ROAD_DAY = {
  interstate: { band: "rgba(85, 110, 140, 0.95)", shoulder: "#60a5fa", fog: "#94a3b8", median: "#ffd700" },
  highway: { band: "rgba(120, 95, 70, 0.9)", shoulder: "#fb923c", fog: "#94a3b8" },
};
// At night the roads should read as LIT - the lanes are the one thing
// still bright once the land has gone dark, which is what sells the
// whole cycle. The previous highway night colour was far too timid to
// register against the graded land; this is a proper sodium-lamp amber.
const ROAD_NIGHT = {
  interstate: { band: "rgba(170, 205, 230, 0.92)", shoulder: "#7dd3fc", fog: "#cbd5e1", median: "#ffd700" },
  highway: { band: "rgba(240, 180, 90, 0.92)", shoulder: "#fdba74", fog: "#cbd5e1" },
};
// Simplified (zoomed-out) atlas-style single line per road kind, day/night
// tinted the same as the full band's asphalt color.
const SIMPLE_PX = { interstate: 2.2, highway: 1.4 };

// Zoom thresholds for the road LOD cross-fade, expressed in *screen*
// pixels of full band width (BAND_HALF*2 = 34 world units) so they are
// resolution-independent rather than tied to a specific camera.zoom
// number. Comfortably above every fitZoom() (~0.09-0.20) and below
// FOLLOW_ZOOM (2.4), so whole-country views stay simplified and
// follow/nav views always render full detail.
const DETAIL_MIN_PX = 18; // band width in screen px below which only the simple line renders
const DETAIL_FULL_PX = 34; // band width in screen px above which only full detail renders

const MEDIAN_WIDTH = 0.7;
// Stroke widths of the two thin road detail layers, in world units. Named
// rather than inlined so drawRoads can compare them against the current
// zoom and skip whichever would land under a screen pixel.
const SHOULDER_LINE_WIDTH = 1.8;
const FOG_LINE_WIDTH = 1.0;

// Viewport-cull padding for the per-truck draw loop, in world units - only
// covers the dot's own footprint (radius + selection ring + stroke), tied
// to TRUCK_DOT_RADIUS so it can't silently drift out of sync if that ever
// changes. This is a performance guard, not a visibility feature: a truck
// just outside the true visible area still simulates identically, it just
// isn't drawn - false positives (drawing a couple extra off-screen trucks)
// are fine, false negatives (clipping a truck that should be visible) are not.
const CULL_PAD_WORLD_UNITS = TRUCK_DOT_RADIUS + 8;
// Wider cull pad for roads/city dots - the drawn band extends BAND_HALF
// (17) world units off each edge's centerline, not just a dot's footprint.
const ROAD_CULL_PAD_WORLD_UNITS = BAND_HALF + 8;

// One draw bucket per cargo/truck-type color (7 distinct colors today, see
// economy.js's TRUCK_TYPES) - built once at module scope, cleared and
// refilled every frame instead of allocated fresh, so the per-truck draw
// loop can batch every truck of the same color into a single
// beginPath()/fill() pass instead of one pair per truck.
const truckBuckets = new Map(Object.values(TRUCK_TYPES).map((tt) => [tt.id, { color: tt.color, xs: [], ys: [] }]));

// Headlight cones, kept deliberately short and narrow so they read as a
// truck's own lights on the pavement rather than searchlights. Flat
// [x, y, bearing, ...] triples in one reused array - same
// no-allocation-per-frame discipline as truckBuckets above.
const HEADLIGHT_LEN = 13;      // world units of throw ahead of the dot
const HEADLIGHT_HALF_W = 2.2;  // half-width at the truck itself
const HEADLIGHT_SPREAD = 4.6;  // half-width at the far end of the beam
const HEADLIGHT_COLOR = "rgba(255, 220, 150, 0.16)";
const headlightPts = [];

// Multiples of camera.baseZoom at which each additional tier of city
// labels comes into view. Tier 1 is visible from the spawn/fit zoom
// onward; each further tier needs progressively more zoom-in, revealed
// cumulatively (zooming to see tier 3 still shows tiers 1-2).
const LABEL_TIER_ZOOM_MULT = { 1: 1.0, 2: 1.7, 3: 3.2, 4: 5.5 };
// tier1 = old 25px shrunk 20%; each tier below is 25% smaller than the
// tier directly above it (20*0.75=15, 15*0.75=11.25->11, 11*0.75=8.25->8) -
// a steeper cascade than the old {25,24,23,22}.
const LABEL_FONT_PX = { 1: 20, 2: 15, 3: 11, 4: 8 };

// Dot size follows the SAME cascade as the label font, so a tier's dot and
// its label shrink together rather than drifting apart if either is
// retuned - derived from LABEL_FONT_PX rather than restated as its own
// table. Tier 1 additionally gets a 25% boost on top so the major hubs
// clearly anchor the map.
const DOT_TIER1_BOOST = 1.25;
const CITY_DOT_SCALE = {};
for (const t of [1, 2, 3, 4]) CITY_DOT_SCALE[t] = DOT_TIER1_BOOST * (LABEL_FONT_PX[t] / LABEL_FONT_PX[1]);

// The one place the dot radius is computed. Three separate call sites used
// to inline this same expression (the dot pass, the label offset, and the
// route highlight ring); the ring in particular has to agree exactly with
// the dot or it stops hugging it.
function cityDotRadius(node) {
  const base = Math.max(2, Math.min(9, 2 + node.w * 0.7));
  return base * (CITY_DOT_SCALE[node.t] || 1);
}
// Every tier is pure white. The old off-white-to-grey cascade was tuned
// against a near-black basemap; against the filled slate landmass and the
// grey asphalt bands the lower tiers greyed out into the terrain. Tier is
// still legible from the LABEL_FONT_PX size cascade, so brightness doesn't
// need to carry that distinction too.
const LABEL_COLOR = { 1: "#ffffff", 2: "#ffffff", 3: "#ffffff", 4: "#ffffff" };
const OFF_ROUTE_LABEL_SCALE = 0.7; // additional shrink for labels not on the followed truck's route ahead
const ROUTE_HIGHLIGHT_COLOR = "rgba(232, 163, 61, 0.85)"; // same amber as the dashed route-preview line/waypoint dots

// ---------------------------------------------------------------------
// Day/night
// ---------------------------------------------------------------------
// Time-of-day sky grade. The reference sim only hard-swapped between a
// day and a night palette at a darkness threshold; this interpolates a
// full keyframed colour ramp instead, so the map warms through sunrise,
// sits neutral at midday, burns orange at golden hour and cools into deep
// blue overnight. Each keyframe is [minute-of-day, r, g, b, alpha], and
// alpha 0 at midday means the baked basemap shows through completely
// untinted - i.e. the bake IS the noon look and everything else grades
// away from it. Wraps around midnight.
// Deliberately three legible phases rather than a continuous smear:
// a flat untinted DAY, a narrow strongly-warm DUSK/DAWN band that sweeps
// across the country, and a deep near-black NIGHT. Alpha 0 through the
// middle of the day means the baked basemap shows through completely, so
// "day" is unambiguously the bright state; the warm band is short and
// saturated so the sweep is unmistakable as it crosses; night is heavy
// enough to read as genuinely dark. Times are LOCAL minutes, so with the
// NYC anchor in geo.js the 19:00 peak is sunset in New York exactly.
const SKY_KEYFRAMES = [
  [0,     4,   8,  20, 0.80], // 00:00 deep night
  [300,   4,   8,  20, 0.80], // 05:00 still deep night
  [375,  34,  28,  56, 0.64], // 06:15 first violet light
  [420, 198, 108,  46, 0.44], // 07:00 DAWN - peak warm, sweeps west
  [480, 150, 122,  92, 0.15], // 08:00 warm morning fading out
  [540, 255, 255, 255, 0.0],  // 09:00 full day begins
  [1020, 255, 255, 255, 0.0], // 17:00 full day ends
  [1080, 158, 118,  72, 0.16],// 18:00 warm late afternoon
  [1140, 208,  98,  34, 0.46],// 19:00 DUSK - peak warm, sweeps west
  [1200,  86,  44,  62, 0.64],// 20:00 violet twilight
  [1290,   4,   8,  20, 0.80],// 21:30 full night
];

// Interpolated sky tint at a local minute-of-day, as {r,g,b,a}.
function skyTintAtMinute(m) {
  let i = 0;
  while (i < SKY_KEYFRAMES.length - 1 && SKY_KEYFRAMES[i + 1][0] <= m) i++;
  const a = SKY_KEYFRAMES[i];
  const b = SKY_KEYFRAMES[(i + 1) % SKY_KEYFRAMES.length];
  // The final segment wraps past midnight back to the first keyframe.
  const span = (b[0] - a[0] + 1440) % 1440 || 1440;
  const t = Math.max(0, Math.min(1, ((m - a[0] + 1440) % 1440) / span));
  return {
    r: Math.round(a[1] + (b[1] - a[1]) * t),
    g: Math.round(a[2] + (b[2] - a[2]) * t),
    b: Math.round(a[3] + (b[3] - a[3]) * t),
    a: a[4] + (b[4] - a[4]) * t,
  };
}

// The tint at a world X, damped for time-scale the same way darkness is
// (see effectiveDarkness) so cranking the speed slider doesn't strobe the
// whole palette - the alpha is pulled toward its daily mean, which leaves
// a permanent gentle dusk rather than a flicker.
function skyTintAtX(worldX, gameSeconds, timeScale) {
  const tint = skyTintAtMinute(localMinutesAtX(Math.max(0, Math.min(WORLD_WIDTH, worldX)), gameSeconds));
  const blend = 1 / (1 + Math.max(0, timeScale - 1) * 0.6);
  tint.a = tint.a * blend + SKY_AVG_ALPHA * (1 - blend);
  return tint;
}

// Mean alpha across the keyframe ramp, for the time-scale damping above.
const SKY_AVG_ALPHA = (() => {
  let sum = 0;
  for (let m = 0; m < 1440; m += 10) sum += skyTintAtMinute(m).a;
  return sum / 144;
})();

function lerpColor(hexA, hexB, t) {
  const a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
  const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
  const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
  const r = Math.round(ar + (br - ar) * t), g = Math.round(ag + (bg - ag) * t), bl = Math.round(ab + (bb - ab) * t);
  return `rgb(${r}, ${g}, ${bl})`;
}

// City-glow pre-render: much lower resolution than the road/border bitmap
// (the glow is intrinsically soft, so upscaling it is invisible) to keep
// memory sane - GLOW_SCALE 0.4 -> a fraction of the bg canvas's footprint.
const GLOW_SCALE = 0.4;
// Tier-based glow used to be the reference sim's approach (procedural,
// name-seeded, hardcoded per-tier constants); we have genuine population
// figures for every real city (src/data.js), so intensity/spread are
// derived from actual `node.pop` instead - a five-order-of-magnitude
// range (100 to 8.34M), so linear scaling is unusable; sqrt for radius
// (lit area ~ population) and log10 for intensity/cluster-count (so the
// smallest towns aren't invisible and the biggest metros don't clip).
const GLOW_WARM_COLORS = ["255,210,140", "255,240,215", "200,220,255"];

function renderCityGlow(graph) {
  const glow = document.createElement("canvas");
  glow.width = WORLD_WIDTH * GLOW_SCALE;
  glow.height = WORLD_HEIGHT * GLOW_SCALE;
  const gctx = glow.getContext("2d");
  gctx.scale(GLOW_SCALE, GLOW_SCALE);
  gctx.globalCompositeOperation = "lighter";

  for (const name in graph.nodes) {
    const node = graph.nodes[name];
    if (node.t === 0 || !node.pop) continue; // junction filler nodes carry no population

    const rnd = mulberry32(hashStr(name)); // stable across reboots, same pattern every time
    const metroR = Math.max(3, Math.min(110, 0.0312 * Math.sqrt(node.pop)));
    const u = Math.max(0, Math.min(1, (Math.log10(node.pop) - 2) / 4.92)); // 100 -> 0, 8.34M -> 1
    const intensity = 0.10 + 0.58 * Math.pow(u, 1.6);
    const clusters = Math.round(2 + u * 10);

    for (let i = 0; i < clusters; i++) {
      const ang = rnd() * Math.PI * 2;
      const r = Math.sqrt(rnd()) * metroR;
      const cx = node.x + Math.cos(ang) * r, cy = node.y + Math.sin(ang) * r;
      const cr = metroR * (0.25 + rnd() * 0.35);
      const color = GLOW_WARM_COLORS[i % GLOW_WARM_COLORS.length];
      const grad = gctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
      grad.addColorStop(0, `rgba(${color}, ${intensity})`);
      grad.addColorStop(1, `rgba(${color}, 0)`);
      gctx.fillStyle = grad;
      gctx.beginPath();
      gctx.arc(cx, cy, cr, 0, Math.PI * 2);
      gctx.fill();
    }

    // Bright core dot at the city itself, so even a small town reads as a
    // distinct pinprick rather than only a diffuse haze.
    const coreGrad = gctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, metroR * 0.18 + 1.5);
    coreGrad.addColorStop(0, `rgba(255, 245, 220, ${Math.min(1, intensity + 0.25)})`);
    coreGrad.addColorStop(1, "rgba(255, 245, 220, 0)");
    gctx.fillStyle = coreGrad;
    gctx.beginPath();
    gctx.arc(node.x, node.y, metroR * 0.18 + 1.5, 0, Math.PI * 2);
    gctx.fill();
  }

  return glow;
}

// ---------------------------------------------------------------------

function renderStaticBackground(graph, opts = {}) {
  const showStateBorders = opts.showStateBorders !== false; // default on
  const bg = document.createElement("canvas");
  bg.width = WORLD_WIDTH * BG_SCALE;
  bg.height = WORLD_HEIGHT * BG_SCALE;
  const ctx = bg.getContext("2d");
  ctx.scale(BG_SCALE, BG_SCALE);

  ctx.fillStyle = VOID_COLOR;
  ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

  ctx.lineCap = "round";

  // The state rings are closed polygons, so filling them (rather than only
  // stroking, as this used to) yields the whole continental landmass in one
  // path - and because coastlines, the Great Lakes, Chesapeake Bay and
  // Puget Sound are all already separate rings in the data, they fall out
  // as correctly-unfilled water for free. This single fill is what turns
  // the map from "lines floating in a void" into an actual map, and gives
  // the day/night grade a surface to act on.
  ctx.beginPath();
  for (const ring of STATE_BORDER_RINGS) {
    ctx.moveTo(ring[0], ring[1]);
    for (let i = 2; i < ring.length; i += 2) ctx.lineTo(ring[i], ring[i + 1]);
    ctx.closePath();
  }
  ctx.fillStyle = LAND_COLOR;
  ctx.fill();
  // Reuse the exact same path for the border strokes - no need to rebuild it.
  if (showStateBorders) {
    ctx.strokeStyle = STATE_BORDER_COLOR;
    ctx.lineWidth = STATE_BORDER_WIDTH;
    ctx.stroke();
  }

  return bg;
}

// Flat, precomputed edge list for the per-frame road pass - built once
// (memoized per graph object; `graph` itself never changes after boot) so
// drawRoads never re-walks graph.adjacency. Each entry carries a cached
// unit perpendicular (px, py) and a bounding box for cheap per-edge
// culling, in addition to the raw endpoints.
const edgeListCache = new WeakMap();
function buildEdgeList(graph) {
  let cached = edgeListCache.get(graph);
  if (cached) return cached;

  const edges = [];
  // Maps BOTH directed edge objects of a segment to that segment's index
  // in `edges`. Keyed by object identity, so the per-frame congestion
  // tally can find a truck's segment with a plain Map lookup instead of
  // rebuilding an "a|b|route" string for every truck every frame - at
  // 5000 trucks that string churn would dwarf the drawing itself.
  const indexByEdge = new Map();
  for (const name in graph.nodes) {
    const node = graph.nodes[name];
    for (const e of graph.adjacency[name]) {
      if (name > e.to) continue; // each undirected edge stored once
      const other = graph.nodes[e.to];
      const dx = other.x - node.x, dy = other.y - node.y;
      const len = Math.hypot(dx, dy) || 1;
      const idx = edges.length;
      edges.push({
        ax: node.x, ay: node.y, bx: other.x, by: other.y,
        kind: e.kind,
        px: -dy / len, py: dx / len,
