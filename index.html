<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Interstate Fleet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map"></canvas>

  <div id="hud">
    <div id="top-bar">
      <span id="clock">DAY 1 &nbsp;6:00 AM</span>
      <span class="divider">/</span>
      <span id="fleet-count">0 UNITS</span>
    </div>

    <!-- Read-only status while driving - no controls live here anymore
         (throttle/PULL IN moved into the RIG tab, full-size, where a
         thumb can actually hit them; see career-ui.js's renderRigTab).
         Tapping anywhere on the bar opens RIG - it's a shortcut into the
         cockpit, not a second place to act from up here. Sits directly
         under #top-bar so the two weld into one instrument cluster in
         career mode (see body.career-mode rules in style.css). -->
    <button id="career-status" class="hidden" title="Open your rig">
      <span id="career-status-cash">$0</span>
      <span class="divider">/</span>
      <span id="career-status-fuel" title="Fuel">&#9981; 0%</span>
      <span id="career-status-fatigue" title="Fatigue">&#128564; 0%</span>
      <span id="career-status-hotshot" class="hidden"></span>
      <span id="career-status-heat" class="hidden" title="Police heat">&#128680;</span>
    </button>

    <!-- These three used to stack one-per-row beneath the bar above,
         which in career mode put five separate elements down the middle
         of the screen, right where a followed truck reads best. One
         wrapping row instead. -->
    <div id="hud-actions">
      <!-- Only shown while the career UI view (career tab set + status
           bar) is on screen. Backgrounds that view back to the spectator
           top bar/tabs WITHOUT ending the career - the CAREER pill
           reappears and resumes it. It used to be pinned to the top-left
           corner, where at phone width it sat directly on top of the
           clock/status cluster; it's an action, so it lives with the
           other actions. -->
      <button id="btn-back-to-map" class="pill-btn hidden">&larr; MAP</button>
      <button id="btn-nav-toggle" class="pill-btn hidden">NAV VIEW</button>
      <button id="btn-career" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)">&#128666; CAREER</button>
      <!-- Manual trigger for Director Mode (main.js/director.js) - the
           auto-idle trigger alone would mean sitting untouched for a full
           settings.directorIdleSeconds just to see it once. Hidden during a
           career (director never runs there - see updateCareerHud). -->
      <button id="btn-director" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)" title="Watch the sim">&#127909; DIRECTOR</button>
      <!-- Cockpit/Command toggle - only ever shown while a career is
           active (see updateCareerHud). Cockpit is the default driving
           view; Command zooms the camera out and swaps the sheet to the
           fleet-management tabs (FLEET/BOOKS/WORLD), hiding RIG. -->
      <button id="btn-mode-toggle" class="pill-btn hidden" title="Switch between driving and managing your fleet">&#128665; COMMAND</button>
    </div>
  </div>

  <button id="btn-settings" title="Settings">&#9881;</button>
  <!-- Sim-speed control: used to be a slider sharing the centered #top-bar
       with the clock. Moved to a corner chip (matching #btn-settings'
       pinning) so the top-center of the map - exactly where a followed
       truck reads best - isn't permanently occupied by a control most
       taps never touch. #time-readout/#time-slider keep their ids
       unchanged - main.js's one `input` listener and two `.value` writes
       need no change at all. -->
  <button id="time-readout" title="Simulation speed">1.0&times;</button>
  <div id="speed-popover" class="hidden">
    <div id="speed-presets">
      <button class="chip" data-speed="0">0&times;</button>
      <button class="chip" data-speed="0.5">0.5&times;</button>
      <button class="chip active" data-speed="1">1&times;</button>
      <button class="chip" data-speed="2">2&times;</button>
      <button class="chip" data-speed="4">4&times;</button>
      <button class="chip" data-speed="8">8&times;</button>
    </div>
    <input type="range" id="time-slider" min="0" max="8" step="0.5" value="1" title="Simulation speed">
  </div>
  <div id="fps-counter">60 FPS</div>

  <div id="settings-overlay" class="hidden">
    <div id="settings-panel">
      <div id="settings-title">Simulation Settings</div>

      <div class="settings-row">
        <label for="setting-fleet-size">Fleet Size</label>
        <input type="number" id="setting-fleet-size" min="10" max="10000" step="10" value="1000">
      </div>

      <div class="settings-row">
        <label for="setting-start-time">Start Time</label>
        <select id="setting-start-time">
          <option value="0">12:00 AM</option>
          <option value="21600" selected>6:00 AM</option>
          <option value="43200">12:00 PM</option>
          <option value="64800">6:00 PM</option>
        </select>
      </div>

      <div class="settings-row">
        <label for="setting-default-speed">Default Speed <span id="setting-default-speed-val">1.0&times;</span></label>
        <input type="range" id="setting-default-speed" min="0" max="8" step="0.5" value="1">
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-all-labels">Show All City Labels</label>
        <label class="switch"><input type="checkbox" id="setting-all-labels"><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-medians">Show Interstate Medians</label>
        <label class="switch"><input type="checkbox" id="setting-medians" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-state-borders">Show State Borders</label>
        <label class="switch"><input type="checkbox" id="setting-state-borders" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-day-night">Day / Night Cycle</label>
        <label class="switch"><input type="checkbox" id="setting-day-night" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-city-lights">City Lights at Night</label>
        <label class="switch"><input type="checkbox" id="setting-city-lights" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-headlights">Truck Headlights at Night</label>
        <label class="switch"><input type="checkbox" id="setting-headlights" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-convoy-tethers">Convoy Tethers</label>
        <label class="switch"><input type="checkbox" id="setting-convoy-tethers" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-congestion">Show Congestion Heat</label>
        <label class="switch"><input type="checkbox" id="setting-congestion" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-cb-radio">CB Radio Chatter</label>
        <label class="switch"><input type="checkbox" id="setting-cb-radio" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-weather">Weather Systems</label>
        <label class="switch"><input type="checkbox" id="setting-weather"><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-rush-hour">Rush Hour Traffic</label>
        <label class="switch"><input type="checkbox" id="setting-rush-hour" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row">
        <label for="setting-director-idle">Director Mode</label>
        <select id="setting-director-idle">
          <option value="0">Off</option>
          <option value="30">After 30s</option>
          <option value="45" selected>After 45s</option>
          <option value="90">After 90s</option>
        </select>
      </div>

      <div id="settings-actions">
        <button id="btn-settings-cancel" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)">Cancel</button>
        <button id="btn-settings-apply" class="pill-btn" style="background:var(--go)">Apply &amp; Restart Sim</button>
      </div>
    </div>
  </div>

  <div id="decision-overlay" class="hidden">
    <div id="decision-title">Junction Ahead &mdash; Choose Your Route</div>
    <div id="decision-options"></div>
    <div id="decision-timer"><div id="decision-timer-fill"></div></div>
  </div>

  <div id="contract-overlay" class="hidden">
    <div id="contract-title">Load Board &mdash; <span id="contract-city"></span></div>
    <div id="contract-options"></div>
    <div id="contract-timer"><div id="contract-timer-fill"></div></div>
  </div>

  <div id="truckstop-overlay" class="hidden">
    <div id="truckstop-header">
      <div>
        <div id="truckstop-city">Truck Stop</div>
        <div id="truckstop-clock"></div>
      </div>
      <button id="btn-truckstop-close" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)">&times; Leave Cab</button>
    </div>
    <div id="truckstop-tabs"></div>
    <div id="truckstop-content"></div>
    <div id="truckstop-footer">
      <div id="truckstop-status"></div>
      <button id="btn-roll-out" class="pill-btn" style="background:var(--go)">ROLL OUT</button>
    </div>
  </div>

  <!-- Company creation wizard - a separate full-screen overlay from the
       truck stop above (reuses its shape via the shared .fullscreen-*
       classes, never the truck-stop element itself). Hidden by default;
       opened only from the "Set Up My Company" choice below on a fresh
       career start. -->
  <div id="wizard-overlay" class="fullscreen-overlay hidden">
    <div class="fullscreen-header">
      <div>
        <div id="wizard-title" class="fullscreen-title">Start Your Company</div>
        <div id="wizard-step-sub" class="fullscreen-sub"></div>
      </div>
      <button id="btn-wizard-close" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)">&times; Cancel</button>
    </div>
    <div id="wizard-tabs" class="fullscreen-tabs"></div>
    <div id="wizard-content" class="fullscreen-content"></div>
    <div id="wizard-footer" class="fullscreen-footer">
      <button id="btn-wizard-back" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)">&larr; Back</button>
      <button id="btn-wizard-next" class="pill-btn" style="background:var(--go)">Next &rarr;</button>
    </div>
  </div>

  <!-- Fresh-career choice: Quick Start (today's one-tap CAREER behavior,
       untouched) vs. the wizard above. Never shown for a saved-career
       reattach, which is unaffected by any of this. -->
  <div id="career-start-choice" class="hidden">
    <div class="csc-title">New Career</div>
    <div class="csc-options">
      <button id="btn-quick-start" class="pill-btn" style="background:var(--go);width:100%;">Quick Start</button>
      <button id="btn-setup-company" class="pill-btn" style="background:var(--panel-strong);color:var(--ink);width:100%;">Set Up My Company</button>
    </div>
  </div>

  <div id="bottom-sheet">
    <div id="sheet-handle"></div>
    <div id="sheet-tabs">
      <!-- Spectator tabs (default): visible unless a career is active.
           Career tabs (RIG/FLEET/BOOKS/WORLD): the reverse. Never both at
           once - see career-ui.js's updateCareerHud, which is also what
           forces a fallback selection if the active tab is the one just
           hidden. Both sets are declared up front (not injected later) so
           el's static-vs-live query concerns never come up. -->
      <!-- Icon over label: four condensed uppercase words competing for a
           400px-wide row was the whole tab bar's legibility problem. The
           glyph is what you actually aim at; the word confirms it. The
           click handler reads .closest(".tab-btn"), so nested spans are
           transparent to it. -->
      <button class="tab-btn active spectator-tab" data-tab="overview"><span class="tab-icon">&#128203;</span><span class="tab-label">Dispatch</span></button>
      <button class="tab-btn spectator-tab" data-tab="rankings"><span class="tab-icon">&#127942;</span><span class="tab-label">Rankings</span></button>
      <button class="tab-btn spectator-tab" data-tab="economy"><span class="tab-icon">&#128200;</span><span class="tab-label">Economy</span></button>
      <button class="tab-btn spectator-tab" data-tab="cb"><span class="tab-icon">&#128251;</span><span class="tab-label">CB Feed</span><span id="cb-unread" class="tab-badge hidden"></span></button>
      <button class="tab-btn career-tab hidden" data-tab="rig"><span class="tab-icon">&#128667;</span><span class="tab-label">Rig</span></button>
      <button class="tab-btn career-tab hidden" data-tab="fleet"><span class="tab-icon">&#128101;</span><span class="tab-label">Fleet</span></button>
      <button class="tab-btn career-tab hidden" data-tab="books"><span class="tab-icon">&#128181;</span><span class="tab-label">Books</span></button>
      <button class="tab-btn career-tab hidden" data-tab="world"><span class="tab-icon">&#127760;</span><span class="tab-label">World</span></button>
    </div>
    <div class="tab-content">
      <div id="tab-overview" class="content-panel active"></div>
      <div id="tab-rankings" class="content-panel"></div>
      <div id="tab-economy" class="content-panel"></div>
      <!-- #cb-feed is cb.js's one persistent feed element - it never gets
           destroyed/rebuilt (cb.js appends messages into it directly and
           tracks its own scroll position). This div is its HOME while
           spectating; career-ui.js's renderWorldTab reparents it into the
           World tab's own slot while a career is active, and moves it
           back here the moment the career ends - see updateCareerHud. -->
      <div id="tab-cb" class="content-panel"><div id="cb-feed"></div></div>
      <div id="tab-rig" class="content-panel"></div>
      <div id="tab-fleet" class="content-panel"></div>
      <div id="tab-books" class="content-panel"></div>
      <div id="tab-world" class="content-panel"></div>
      <!-- Not a tab: tapping a truck or a city slides this over whichever
           tab is open, and the back button (or picking any tab) closes it
           again. Inspecting something is a detour from browsing, not a
           fifth place to browse. -->
      <div id="detail-sheet" class="hidden">
        <div id="detail-bar">
          <button id="detail-back" class="pill-btn">&larr; Back</button>
          <span id="detail-bar-title"></span>
        </div>
        <div id="details-data"></div>
      </div>
    </div>
  </div>

  <div id="daily-digest" class="hidden"></div>
  <div id="payroll-alert" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <!-- Director Mode (director.js) - own small UI, wholly owned by that
       module (director.js receives these element references via its
       deps, same pattern as career-ui.js owning its DOM rather than
       main.js poking it). The hint/caption/return-chip below deliberately
       carry NO `class="hidden"` - they rest at opacity:0 by CSS default
       (see style.css) and are shown/hidden purely via a `.show` class
       toggle, because this app's global `.hidden` is `display:none
       !important`, which would make a fade impossible no matter what a
       more specific selector said about opacity. -->
  <div id="director-veil"></div>
  <div id="director-hint">&#9679; DIRECTOR &middot; tap anywhere to take over</div>
  <div id="director-caption">
    <div class="dc-eyebrow"></div>
    <div class="dc-line"></div>
  </div>
  <button id="director-return" class="pill-btn">&#8617; Back to your view</button>
  <!-- Transparent, full-screen input shield - the only thing that actually
       receives pointer/wheel/key input while the director owns the camera
       (the map/HUD/sheet underneath are still there, just faded and inert).
       Wiring (pointerdown/wheel/pointermove/keydown -> director.stop) lives
       in main.js, not here - this element is pure markup. -->
  <div id="director-shield" class="hidden"></div>

  <div id="fatal-error" class="hidden"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
