<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Interstate Fleet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map"></canvas>

  <div id="hud">
    <div id="top-bar">
      <span id="clock">DAY 1 &nbsp;6:00 AM</span>
      <span class="divider">/</span>
      <span id="fleet-count">0 UNITS</span>
      <input type="range" id="time-slider" min="0" max="8" step="0.5" value="1" title="Simulation speed">
      <span id="time-readout">1.0&times;</span>
    </div>

    <button id="btn-exit-follow" class="pill-btn hidden">&times; RELEASE</button>
    <button id="btn-nav-toggle" class="pill-btn hidden">NAV VIEW</button>
    <button id="btn-career" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)">&#128666; CAREER</button>
    <div id="career-hud" class="hidden">
      <span id="career-hud-cash">$0</span>
      <span class="divider">/</span>
      <span id="career-hud-fuel">FUEL 0%</span>
      <div id="throttle-group">
        <button class="chip" data-throttle="CONSERVE">CONSERVE</button>
        <button class="chip active" data-throttle="LEGAL">LEGAL</button>
        <button class="chip" data-throttle="HAMMER">HAMMER</button>
      </div>
      <button id="btn-pull-in" class="pill-btn" style="background:var(--caution);color:var(--caution-ink);padding:6px 10px;font-size:0.68rem;">PULL IN</button>
    </div>
  </div>

  <button id="btn-settings" title="Settings">&#9881;</button>
  <div id="fps-counter">60 FPS</div>

  <div id="settings-overlay" class="hidden">
    <div id="settings-panel">
      <div id="settings-title">Simulation Settings</div>

      <div class="settings-row">
        <label for="setting-fleet-size">Fleet Size</label>
        <input type="number" id="setting-fleet-size" min="10" max="10000" step="10" value="1000">
      </div>

      <div class="settings-row">
        <label for="setting-start-time">Start Time</label>
        <select id="setting-start-time">
          <option value="0">12:00 AM</option>
          <option value="21600" selected>6:00 AM</option>
          <option value="43200">12:00 PM</option>
          <option value="64800">6:00 PM</option>
        </select>
      </div>

      <div class="settings-row">
        <label for="setting-default-speed">Default Speed <span id="setting-default-speed-val">1.0&times;</span></label>
        <input type="range" id="setting-default-speed" min="0" max="8" step="0.5" value="1">
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-all-labels">Show All City Labels</label>
        <label class="switch"><input type="checkbox" id="setting-all-labels"><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-medians">Show Interstate Medians</label>
        <label class="switch"><input type="checkbox" id="setting-medians" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-state-borders">Show State Borders</label>
        <label class="switch"><input type="checkbox" id="setting-state-borders" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-day-night">Day / Night Cycle</label>
        <label class="switch"><input type="checkbox" id="setting-day-night" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-city-lights">City Lights at Night</label>
        <label class="switch"><input type="checkbox" id="setting-city-lights" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-headlights">Truck Headlights at Night</label>
        <label class="switch"><input type="checkbox" id="setting-headlights" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-congestion">Show Congestion Heat</label>
        <label class="switch"><input type="checkbox" id="setting-congestion" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-cb-radio">CB Radio Chatter</label>
        <label class="switch"><input type="checkbox" id="setting-cb-radio" checked><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-weather">Weather Systems</label>
        <label class="switch"><input type="checkbox" id="setting-weather"><span class="switch-track"></span></label>
      </div>

      <div class="settings-row settings-row-toggle">
        <label for="setting-rush-hour">Rush Hour Traffic</label>
        <label class="switch"><input type="checkbox" id="setting-rush-hour" checked><span class="switch-track"></span></label>
      </div>

      <div id="settings-actions">
        <button id="btn-settings-cancel" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)">Cancel</button>
        <button id="btn-settings-apply" class="pill-btn" style="background:var(--go)">Apply &amp; Restart Sim</button>
      </div>
    </div>
  </div>

  <div id="decision-overlay" class="hidden">
    <div id="decision-title">Junction Ahead &mdash; Choose Your Route</div>
    <div id="decision-options"></div>
    <div id="decision-timer"><div id="decision-timer-fill"></div></div>
  </div>

  <div id="contract-overlay" class="hidden">
    <div id="contract-title">Load Board &mdash; <span id="contract-city"></span></div>
    <div id="contract-options"></div>
    <div id="contract-timer"><div id="contract-timer-fill"></div></div>
  </div>

  <div id="truckstop-overlay" class="hidden">
    <div id="truckstop-header">
      <div>
        <div id="truckstop-city">Truck Stop</div>
        <div id="truckstop-clock"></div>
      </div>
      <button id="btn-truckstop-close" class="pill-btn" style="background:var(--panel-strong);color:var(--ink)">&times; Leave Cab</button>
    </div>
    <div id="truckstop-tabs"></div>
    <div id="truckstop-content"></div>
    <div id="truckstop-footer">
      <div id="truckstop-status"></div>
      <button id="btn-roll-out" class="pill-btn" style="background:var(--go)">ROLL OUT</button>
    </div>
  </div>

  <div id="bottom-sheet">
    <div id="sheet-handle"></div>
    <div id="sheet-tabs">
      <button class="tab-btn active" data-tab="overview">Dispatch</button>
      <button class="tab-btn" data-tab="rankings">Rankings</button>
      <button class="tab-btn" data-tab="economy">Economy</button>
      <button class="tab-btn" data-tab="cb">CB Feed<span id="cb-unread" class="tab-badge hidden"></span></button>
      <button class="tab-btn hidden" id="tab-btn-career" data-tab="career">Career</button>
    </div>
    <div class="tab-content">
      <div id="tab-overview" class="content-panel active"></div>
      <div id="tab-rankings" class="content-panel"></div>
      <div id="tab-economy" class="content-panel"></div>
      <div id="tab-cb" class="content-panel"></div>
      <div id="tab-career" class="content-panel"></div>
      <!-- Not a tab: tapping a truck or a city slides this over whichever
           tab is open, and the back button (or picking any tab) closes it
           again. Inspecting something is a detour from browsing, not a
           fifth place to browse. -->
      <div id="detail-sheet" class="hidden">
        <div id="detail-bar">
          <button id="detail-back" class="pill-btn">&larr; Back</button>
          <span id="detail-bar-title"></span>
        </div>
        <div id="details-data"></div>
      </div>
    </div>
  </div>

  <div id="daily-digest" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="fatal-error" class="hidden"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
